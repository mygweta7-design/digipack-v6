    function normalizeProcessId(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      const match = text.match(/\d+/);
      if (!match) return "";
      const id = Number(match[0]);
      return PRODUCTION_PROCESSES[id] ? id : "";
    }

    function getProcessSteps(processId) {
      const id = normalizeProcessId(processId);
      return id ? PRODUCTION_PROCESSES[id] : [];
    }

    function getProcessText(processId) {
      const steps = getProcessSteps(processId);
      return steps.length ? steps.join(" → ") : "";
    }

    function renderProcessFlow(processId) {
      const steps = getProcessSteps(processId);
      if (!steps.length) return "";
      return `
        <div class="bg-green-900/25 border border-green-700 rounded-2xl p-4 mt-4">
          <div class="font-bold text-green-200 mb-2">תהליך ייצור</div>
          <div class="flex flex-wrap items-center gap-2 text-lg font-bold">
            ${steps.map((step, i) => `
              <span class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-xl">${escapeHtml(step)}</span>
              ${i < steps.length - 1 ? `<span class="text-green-300">←</span>` : ""}
            `).join("")}
          </div>
        </div>`;
    }

    function findProcessIdInRow(row) {
      return normalizeProcessId(findValue(row, ["תהליך", "מספר תהליך", "process", "process_id", "process id"]));

    async function loadEmployees() {
      const { data, error } = await client.from("employees").select("*").eq("active", true).order("name");
      const select = document.getElementById("employee");
      if (error) { document.getElementById("loginError").innerText = "שגיאה בטעינת עובדים: " + error.message; return; }

        const option = document.createElement("option");
        option.value = emp.id;
        option.textContent = emp.name;
        option.dataset.password = emp.password;
        option.dataset.role = emp.role;
        select.appendChild(option);
      });
    }

    function login() {
      const select = document.getElementById("employee");
      const selected = select.options[select.selectedIndex];
      const password = document.getElementById("password").value;
      if (!selected.value) return document.getElementById("loginError").innerText = "בחר עובד";
      if (password !== selected.dataset.password) { document.getElementById("password").value = ""; return document.getElementById("loginError").innerText = "סיסמה שגויה"; }

      currentEmployee = { id: selected.value, name: selected.textContent, role: selected.dataset.role };
      if (currentEmployee.role === "manager") renderManager();
      else renderStartForm();
    }


    function parseQRPayload(raw) {
      const text = String(raw || "").trim();

      try {
        const parsed = JSON.parse(text);
        return {
          order: parsed.order || parsed.order_number || parsed.pka || parsed["מספר הזמנה"] || "",
          line: parsed.line || parsed.order_line || parsed["שורה"] || "",
          customer: parsed.customer || parsed.customer_name || parsed["שם לקוח"] || "",
          product: parsed.product || parsed.product_name || parsed.description || parsed["תאור מוצר"] || parsed["תיאור מוצר"] || "",
          qty: parsed.qty || parsed.quantity || parsed["כמות"] || "",
          dueDate: parsed.dueDate || parsed.delivery_date || parsed["תאריך אספקה"] || "",
          processId: normalizeProcessId(parsed.process_id || parsed.processId || parsed.process || parsed["תהליך"] || parsed["מספר תהליך"] || ""),
          qrCode: parsed.qrCode || text,
          raw: text
        };
      } catch (e) {
        const parts = text.split(".");
        return {
          order: text,
          line: parts.length >= 3 ? parts[2] : (parts[1] || ""),
          customer: "",
          product: "",
          qty: "",
          dueDate: "",
          processId: "",
          qrCode: text,
          raw: text
        };
      }
    }


    function normalizeQrBase(value) {
      const s = String(value || "").trim();
      const parts = s.split(".").filter(Boolean);
      if (parts.length >= 3) return parts.slice(0, 3).join(".");
      return s;
    }

    function labelMatchesPendingOrder(row) {
      if (!pendingOrderData || !row) return false;
      const base = normalizeQrBase(pendingOrderData.qrCode || pendingOrderData.order || "");
      const order = String(pendingOrderData.order || "").trim();
      const rowQr = String(row.qr_code || "").trim();
      const rowOrder = String(row.order_number || "").trim();
      if (base && (rowQr === base || rowQr.startsWith(base + ".") || normalizeQrBase(rowQr) === base)) return true;
      if (order && (rowOrder === order || rowQr.startsWith(order + "."))) return true;
      return false;
    }

    function buildLabelFromRollRow(row) {
      const originalData = row?.label_data || {};
      return {
        ...originalData,
        rollId: originalData.rollId || row?.qr_code || "",
        qrCode: row?.qr_code || originalData.qrCode || "",
        pka: row?.order_number || originalData.pka || "",
        line: row?.order_line || originalData.line || "",
        customer: row?.customer_name || originalData.customer || "",
        product: row?.product_name || originalData.product || originalData.productName || "",
        quantity: row?.quantity || originalData.quantity || "",
        unit: row?.unit || originalData.unit || "מטרים",
        rollNumber: row?.roll_number || originalData.rollNumber || "",
        operatorName: row?.operator_1 || row?.employee_name || originalData.operatorName || "",
        operator2: row?.operator_2 || originalData.operator2 || "",
        shiftChangeAt: row?.shift_change_at || originalData.shiftChangeAt || "",
        department: row?.department || originalData.department || getCurrentDepartmentName(),
        dateTime: originalData.dateTime || (row?.printed_at ? new Date(row.printed_at).toLocaleString("he-IL") : ""),
        dateTimeIso: row?.printed_at || originalData.dateTimeIso || new Date().toISOString(),
        jobRows: originalData.jobRows || [{
          line: row?.order_line || originalData.line || "",
          pka: row?.order_number || originalData.pka || "",
          customer: row?.customer_name || originalData.customer || "",
          product: row?.product_name || originalData.product || originalData.productName || "",
          quantity: row?.quantity || originalData.quantity || ""
        }]
      };
    }

    async function loadWorkerRollLabels() {
      const container = document.getElementById("workerRollLabelsContainer");
      if (!container || !pendingOrderData) return;
      container.innerHTML = `<p class="text-gray-400">טוען תוויות שכבר הודפסו...</p>`;

        .select("*")

        .limit(500);

      }

      const originals = workerRollLabelsRows.filter(r => !r.is_copy);

      if (!rowsToShow.length) {

    }

    async function assignSecondOperatorToRoll(id) {

    function renderOrderInfoCard() {

    function renderQRScanner() {
      page(`
        ${topBar("סריקת QR הזמנה", `עובד: ${currentEmployee.name}`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">
          <p class="text-gray-300">כוון את המצלמה לברקוד/QR שעל פקודת העבודה.</p>

          <canvas id="qrCanvas" class="hidden"></canvas>
          <p id="qrMsg" class="text-yellow-300">מפעיל מצלמה...</p>
          <button onclick="stopQRScanner(); renderStartForm()" class="w-full bg-gray-700 p-4 rounded-2xl font-bold">חזור</button>
        </section>`);
      startQRScanner();
    }

    let qrStream = null;
    let qrScanTimer = null;

    async function startQRScanner() {
      const msg = document.getElementById("qrMsg");
      const video = document.getElementById("qrVideo");

      if (!("BarcodeDetector" in window)) {
        msg.innerText = "הדפדפן לא תומך בסריקת QR מובנית. אפשר להקליד פק״ע ידנית.";
        return;
      }

      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = qrStream;
        const detector = new BarcodeDetector({ formats: ["qr_code"] });

        qrScanTimer = setInterval(async () => {
          try {
            const codes = await detector.detect(video);
            if (codes && codes.length) {
              const raw = codes[0].rawValue;
              let parsed = parseQRPayload(raw);
              const found = await findOrderLineByQR(parsed.qrCode || raw);
              pendingOrderData = found || parsed;
              stopQRScanner();
              renderStartForm();
              setTimeout(() => {
                const pka = document.getElementById("pkaNumber");
                if (pka && pendingOrderData.order) pka.value = pendingOrderData.order;
              }, 50);
            }
          } catch (e) {}
        }, 500);

        msg.innerText = "מוכן לסריקה";
      } catch (e) {
        msg.innerText = "לא ניתן לפתוח מצלמה: " + e.message;
      }
    }

    function stopQRScanner() {
      if (qrScanTimer) clearInterval(qrScanTimer);
      qrScanTimer = null;
      if (qrStream) qrStream.getTracks().forEach(t => t.stop());
      qrStream = null;
    }


    function getLastDigits(value, count = 4) {
      const digits = String(value || "").replace(/\D/g, "");
      return digits.slice(-count).padStart(count, "0");
    }

    function getYearTwoDigitsFromRow(row) {
      const raw = findValue(row, ["שנה", "שנת הזמנה", "תאריך הזמנה", "תאריך", "date"]);
      if (!raw) return String(new Date().getFullYear()).slice(-2);

      if (raw instanceof Date) return String(raw.getFullYear()).slice(-2);

      const text = String(raw);
      const year4 = text.match(/20\d{2}/);
      if (year4) return year4[0].slice(-2);

      const year2 = text.match(/\b\d{2}\b/);
      if (year2) return year2[0];

      return String(new Date().getFullYear()).slice(-2);
    }

    function formatLineTwoDigits(value) {
      const digits = String(value || "").replace(/\D/g, "");
      return (digits || "0").padStart(2, "0");
    }

    function buildShortQRFromRow(row) {
      const order = String(findValue(row, ["הזמנה", "מספר הזמנה", "פקע", "פק״ע", "order"]) || "").trim();
      const line = String(findValue(row, ["שורה", "line"]) || "").trim();
      const orderPart = getLastDigits(order, 4);
      const yearPart = getYearTwoDigitsFromRow(row);
      const linePart = formatLineTwoDigits(line);
      return `${orderPart}.${yearPart}.${linePart}`;
    }

    function makeQRDataUrl(text, size = 160) {
      const qr = new QRious({
        value: String(text || ""),
        size,
        level: "H",
        background: "white",
        foreground: "black"
      });
      return qr.toDataURL("image/png");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function normalizeHeader(value) {
      return String(value || "")
        .replaceAll('"', "")
        .replaceAll("'", "")
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function findValue(row, candidates) {
      const keys = Object.keys(row || {});
      for (const candidate of candidates) {
        const normCandidate = normalizeHeader(candidate);
        const key = keys.find(k => normalizeHeader(k).includes(normCandidate) || normCandidate.includes(normalizeHeader(k)));
        if (key) return row[key] ?? "";
      }
      return "";
    }

    function buildQRPayloadFromRow(row) {
      const order = String(findValue(row, ["הזמנה", "מספר הזמנה", "פקע", "פק״ע", "order"]) || "").trim();
      const line = String(findValue(row, ["שורה", "line"]) || "").trim();
      const product = String(findValue(row, ["תאור מוצר", "תיאור מוצר", "שם מוצר", "מוצר", "description", "product"]) || "").trim();

      return {
        order,
        line,
        qrCode: buildShortQRFromRow(row),
        product,
        customer: String(findValue(row, ["שם לקוח", "לקוח", "customer"]) || "").trim(),
        qty: String(findValue(row, ["כמות", "יתרה לאספקה", "qty", "quantity"]) || "").trim(),
        dueDate: String(findValue(row, ["תאריך אספקה", "ת. אספקה", "אספקה", "due", "date"]) || "").trim(),
        processId: findProcessIdInRow(row),
        processText: getProcessText(findProcessIdInRow(row)),
        originalRow: row
      };
    }

    function buildQRScanPayload(row) {
      return JSON.stringify({
        qrCode: row.qrCode || "",
        order: row.order || "",
        line: row.line || "",
        customer: row.customer || "",
        product: row.product || "",
        qty: row.qty || "",
        dueDate: row.dueDate || "",
        process_id: row.processId || "",
        process_text: row.processText || ""
      });
    }

    function getQRScanText(row) {
      // V32.3: The QR image itself contains only the short stable code, e.g. 0730.26.02.
      // Full Hebrew data is saved in Supabase order_lines to avoid dense/unreadable QR and encoding problems.
      return String((row && row.qrCode) || "");
    }

    async function trySaveOrderLines(rows, msg) {
      try {
        const saveResult = await saveOrderLinesToSupabase(rows);
        if (!saveResult.ok) {
          console.error("שמירה ל-order_lines נכשלה", saveResult.error);
          if (msg) msg.innerText = "אזהרה: לא נשמר ל-order_lines, אבל יש לתקן הרשאות order_lines כי ה-QR מכיל קוד קצר בלבד. שגיאה: " + (saveResult.error?.message || "לא ידועה");
          return { ok: false, count: 0, error: saveResult.error };
        }
        console.log("נשמרו order_lines:", saveResult.count);
        return saveResult;
      } catch (e) {
        console.error("שגיאה בשמירה ל-order_lines", e);
        if (msg) msg.innerText = "אזהרה: לא נשמר ל-order_lines, אבל יש לתקן הרשאות order_lines כי ה-QR מכיל קוד קצר בלבד. שגיאה: " + e.message;
        return { ok: false, count: 0, error: e };
      }
    }


    function getOrderLinePayload(row) {
      const order = String(findValue(row, ["הזמנה", "מספר הזמנה", "פקע", "פק״ע", "order"]) || "").trim();
      const line = String(findValue(row, ["שורה", "line"]) || "").trim();
      const customer = String(findValue(row, ["שם לקוח", "לקוח", "customer"]) || "").trim();
      const product = String(findValue(row, ["תאור מוצר", "תיאור מוצר", "שם מוצר", "מוצר", "description", "product"]) || "").trim();
      const qty = String(findValue(row, ["כמות", "יתרה לאספקה", "qty", "quantity"]) || "").trim();
      const dueDate = String(findValue(row, ["תאריך אספקה", "ת. אספקה", "אספקה", "due", "date"]) || "").trim();
      const qrCode = buildShortQRFromRow(row);

      const processId = findProcessIdInRow(row);
      const payload = {
        qr_code: qrCode,
        order_number: order,
        order_line: line,
        customer_name: customer,
        product_name: product,
        quantity: qty,
        due_date: dueDate,
        raw_data: { ...row, process_id: processId || "", process_text: getProcessText(processId) }
      };

      if (processId) {
        payload.process_id = processId;
        payload.process_text = getProcessText(processId);
      }

      return payload;
    }

    async function saveOrderLinesToSupabase(rows) {
      const payload = rows.map(getOrderLinePayload).filter(r => r.qr_code && r.order_number);
      if (!payload.length) return { ok: true, count: 0 };

      const { error } = await client
        .from("order_lines")
        .upsert(payload, { onConflict: "qr_code" });

      if (error) return { ok: false, error };
      return { ok: true, count: payload.length };
    }

    async function findOrderLineByQR(qrCode) {
      const { data, error } = await client
        .from("order_lines")
        .select("*")
        .eq("qr_code", qrCode)
        .maybeSingle();

      if (error) {
        console.error("שגיאה בחיפוש שורת הזמנה:", error);
        return null;
      }

      if (!data) return null;

      return {
        order: data.order_number || "",
        line: data.order_line || "",
        customer: data.customer_name || "",
        product: data.product_name || "",
        qty: data.quantity || "",
        dueDate: data.due_date || "",
        processId: normalizeProcessId(data.process_id || data.raw_data?.process_id || ""),
        processText: data.process_text || getProcessText(data.process_id || data.raw_data?.process_id || ""),
        qrCode: data.qr_code || qrCode,
        raw: qrCode
      };
    }

    async function downloadExcelWithQR() {
      const file = document.getElementById("ordersExcelFile")?.files?.[0];
      const msg = document.getElementById("qrGeneratorMsg");

      if (!file) {
        if (msg) msg.innerText = "בחר קובץ Excel";
        return;
      }

      try {
        if (msg) msg.innerText = "מכין Excel עם QR...";

        const buffer = await file.arrayBuffer();
        const wbRaw = XLSX.read(buffer, { type: "array", cellDates: true });
        const wsRaw = wbRaw.Sheets[wbRaw.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(wsRaw, { defval: "" });

        if (!rows.length) {
          if (msg) msg.innerText = "לא נמצאו שורות בקובץ";
          return;
        }

        if (msg) msg.innerText = "שומר הזמנות ומכין Excel עם QR קצר...";
        await trySaveOrderLines(rows, msg);

        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet("הזמנות עם QR", { views: [{ rightToLeft: true }] });

        const originalHeaders = Object.keys(rows[0]);
        const hasProcessValues = rows.some(row => !!findProcessIdInRow(row));
        const headers = hasProcessValues ? [...originalHeaders, "תהליך ייצור", "QR קוד", "QR"] : [...originalHeaders, "QR קוד", "QR"];
        worksheet.addRow(headers);

        const headerRow = worksheet.getRow(1);
        headerRow.font = { bold: true };
        headerRow.alignment = { vertical: "middle", horizontal: "center" };

        rows.forEach((row, idx) => {
          const qrPayloadRow = buildQRPayloadFromRow(row);
          const qrCode = qrPayloadRow.qrCode;
          const processId = findProcessIdInRow(row);
          const processText = getProcessText(processId);
          const rowValues = hasProcessValues
            ? [...originalHeaders.map(h => row[h]), processText, qrCode, ""]
            : [...originalHeaders.map(h => row[h]), qrCode, ""];
          const excelRow = worksheet.addRow(rowValues);
          excelRow.height = 125;

          const qrDataUrl = makeQRDataUrl(getQRScanText(qrPayloadRow), 320);
          const imageId = workbook.addImage({
            base64: qrDataUrl,
            extension: "png"
          });

          const qrColIndex = headers.length;
          worksheet.addImage(imageId, {
            tl: { col: qrColIndex - 1 + 0.15, row: idx + 1 + 0.15 },
            ext: { width: 118, height: 118 }
          });
        });

        worksheet.columns = headers.map(h => {
          if (h === "QR") return { width: 20 };
          if (h === "QR קוד") return { width: 16 };
          return { width: 18 };
        });

        worksheet.getColumn(headers.length).alignment = { vertical: "middle", horizontal: "center" };

        const outBuffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([outBuffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });

        const today = new Date().toISOString().slice(0, 10);
        downloadBlob(blob, `priority-orders-with-qr-${today}.xlsx`);

        if (msg) msg.innerText = `נוצר Excel עם QR קצר עבור ${rows.length} שורות. ה-QR מכיל קוד קצר; לקוח, מוצר ותהליך נשמרים בטבלת order_lines.`;
      } catch (e) {
        console.error(e);
        if (msg) msg.innerText = "שגיאה ביצירת Excel עם QR: " + e.message;
      }
    }

    function buildPublicLabelUrl(fileName) {
      const encodedPath = fileName.split("/").map(encodeURIComponent).join("/");

    async function saveLabel(file, jobId, pkaNumber, labelType) {
      const originalName = file.name || "label.jpg";
      const ext = originalName.includes(".") ? originalName.split(".").pop() : "jpg";
      const fileName = `${jobId}/${Date.now()}-${labelType}.${ext}`;
      const publicUrl = buildPublicLabelUrl(fileName);

      const { error: uploadError } = await client.storage
        .from("labels")
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: true,
          contentType: file.type || "image/jpeg"
        });

      if (uploadError) {
        console.error("שגיאה בהעלאת תווית:", uploadError);
        alert("שגיאה בהעלאת תווית ל-Storage: " + uploadError.message);
        return "";
      }

      const { error: insertError } = await client
        .from("material_labels")
        .insert({
          job_id: jobId,
          batch_number: pkaNumber,
          label_type: labelType,
          image_url: publicUrl
        });

    function getLastDigits(value, count = 4) {
      const digits = String(value || "").replace(/\D/g, "");
      return digits.slice(-count).padStart(count, "0");
    }

    function formatLineTwoDigits(value) {
      const digits = String(value || "").replace(/\D/g, "");
      return (digits || "0").padStart(2, "0");
    }

    function getCurrentYearTwoDigits() {
      return String(new Date().getFullYear()).slice(-2);
    }

    function buildShortQRFromJob(rollNumber = "") {
      const baseQR = pendingOrderData?.qrCode || "";
      if (baseQR) return rollNumber ? `${baseQR}.${rollNumber}` : baseQR;

      const rawOrder = currentJob?.batch_number || currentJob?.order_number || pendingOrderData?.order || "";
      const orderPart = getLastDigits(rawOrder, 4);
      const yearPart = getCurrentYearTwoDigits();
      const linePart = formatLineTwoDigits(pendingOrderData?.line || "1");
      return rollNumber ? `${orderPart}.${yearPart}.${linePart}.${rollNumber}` : `${orderPart}.${yearPart}.${linePart}`;
    }


    function getMeasurementUnitForDepartment(department = "") {
      const d = String(department || "").trim();
      if (d.includes("שקיות")) return "יחידות";
      return "מטרים";
    }

    function getCurrentDepartmentName() {
      return currentJob?.department || "למינציה";
    }

      try {
        const { error } = await client.from("roll_labels").insert({
          qr_code: label.qrCode,

          order_line: label.line,
          roll_number: String(label.rollNumber || ""),
          quantity: String(label.quantity || ""),
          unit: label.unit || "",
          customer_name: label.customer || "",
          employee_name: label.operatorName || "",
          operator_1: label.operatorName || "",
          operator_2: label.operator2 || "",
          shift_change_at: label.shiftChangeAt || null,
          department: label.department || "",
          printed_at: label.dateTimeIso || new Date().toISOString(),
          original_printed_at: label.dateTimeIso || new Date().toISOString(),
          is_copy: !!isCopy,
          label_data: label
        });
        if (error) console.warn("שמירת תווית גליל נכשלה:", error.message);
      } catch (e) {
        console.warn("שמירת תווית גליל נכשלה:", e.message);
      }
    }

      }).eq("id", currentJob.id);

    function getDateRange(period) {
      const start = new Date();
      const end = new Date();

      if (period === "today") {
        currentPeriodName = "היום";
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "yesterday") {
        currentPeriodName = "אתמול";
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "week") {
        currentPeriodName = "שבוע נוכחי";
        const day = start.getDay(); // Sunday = 0
        start.setDate(start.getDate() - day);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "month") {
        currentPeriodName = "חודש נוכחי";
        start.setDate(1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "year") {
        currentPeriodName = "שנה נוכחית";
        start.setMonth(0,1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      return { start: start.toISOString(), end: end.toISOString() };
    }

    // ===============================
    // V33 — TPI PRINT PLANNING MODULE
    // This module is additive only. Existing lamination / labels / reports remain unchanged.
    // ===============================

    const PRINT_MATERIALS = [
      "PET12", "PET12/760", "PET12/580", "PET MAT12", "PET MET12", "BOPP20", "BOPP MAT", "BOPP PG MAT",
      "PE", "PEEVA23", "CPP", "PET/ALU/PE", "PET ALU PE 87", "PVDC", "BONYL", "TOPAZ", "HB", "CHROMO PAPER", "אחר"
    ];
    const ROLL_DIRECTIONS = ["עין ימין", "עין שמאל", "ראש", "רגל", "לא רלוונטי"];
    const PRINT_SIDES = ["חיצונית", "פנימית"];
    const PACKAGE_TYPES = ["גליל", "שקיות"];

    let importedPriorityOrder = null;
    let importedPriorityLines = [];

    function normalizePriorityDate(value) {
      const text = String(value || "").trim();
      const m = text.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
      if (!m) return "";
      const dd = m[1].padStart(2, "0");
      const mm = m[2].padStart(2, "0");
      let yy = m[3];
      if (yy.length === 2) yy = "20" + yy;
      return `${yy}-${mm}-${dd}`;
    }

    function normalizePriorityOrderNo(text) {
      const raw = String(text || "").trim();
      const m = raw.match(/(\d{6,12})\s*SO/i);
      if (m) return m[1] + "SO";
      const digits = raw.match(/\d{6,12}/);
      return digits ? digits[0] : raw;
    }

    function cleanPriorityText(value) {
      return String(value || "")
        .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, "")
        .replace(/\u00a0/g, " ");
    }

    function parsePriorityOrderText(text) {
      const rawClean = cleanPriorityText(text);
      const t = rawClean.replace(/\s+/g, " ").trim();
      const result = {
        order_number: "",
        customer_name: "",
        customer_po: "",
        customer_no: "",
        order_date: "",
        lines: [],
        raw_text: t
      };

      const orderMatch = t.match(/(?:אישור הזמנה מספר|ברקוד הזמנה)\s*:?\s*\*?\s*(SO\s*\d{6,12}|\d{6,12}\s*SO|\d{6,12})\*?/i) || t.match(/\b(SO\s*\d{6,12}|\d{6,12}\s*SO)\b/i);
      if (orderMatch) result.order_number = normalizePriorityOrderNo(orderMatch[1]);

      const dateMatch = t.match(/תאריך ההזמנה\s*:?\s*(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/);
      if (dateMatch) result.order_date = normalizePriorityDate(dateMatch[1]);

      const poMatch = t.match(/הזמנתכם\s*:?\s*([A-Z]{0,3}\d{5,12}[A-Z]{0,3})/i);
      if (poMatch) result.customer_po = poMatch[1].trim();

      const custNoMatch = t.match(/מס\.?\s*לקוח\s*:?\s*(\d+)/);
      if (custNoMatch) result.customer_no = custNoMatch[1];

      const customerMatch = t.match(/לכבוד\s*:?\s*(.*?)\s+(?:המלאכה|טלפון|אישור הזמנה מספר|אישור הזמנה)/);
      if (customerMatch) result.customer_name = customerMatch[1].trim();

      const startCandidates = [t.indexOf("שורה"), t.indexOf("תאור מוצר"), t.indexOf("תיאור מוצר"), t.indexOf("סה\"כ מחיר")].filter(x => x >= 0);
      const tableStart = startCandidates.length ? Math.min(...startCandidates) : 0;
      const endCandidates = [t.indexOf("מחיר כולל", tableStart + 10), t.indexOf("ברקוד הזמנה", tableStart + 10), t.indexOf("תנאי תשלום", tableStart + 10)].filter(x => x > tableStart);
      const tableText = t.slice(tableStart, endCandidates.length ? Math.min(...endCandidates) : undefined);

      function addLine(line) {
        if (!line || !line.order_line) line.order_line = String(result.lines.length + 1);
        if (/הובלה|עלות הובלה/i.test(line.product_name || "") || /הובלה/i.test(line.sku || "")) return;
        const exists = result.lines.some(r => String(r.order_line) === String(line.order_line) && String(r.sku) === String(line.sku));
        if (!exists) result.lines.push(line);
      }

      // Priority PDF extraction is not always in the same visual order. Support both:
      // date + unit + qty ... sku + line, and date + qty + unit ... sku + line.
      const lineRegexes = [
        /(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})\s+יח\s+([\d,]+(?:\.\d+)?)\s+(.+?)\s+(\d{6,14}|[A-Z0-9][A-Z0-9\-\/.]{2,})\s+(\d{1,3})\b/g,
        /(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})\s+([\d,]+(?:\.\d+)?)\s*יח\s+(.+?)\s+(\d{6,14}|[A-Z0-9][A-Z0-9\-\/.]{2,})\s+(\d{1,3})\b/g
      ];
      for (const rx of lineRegexes) {
        let m;
        while ((m = rx.exec(tableText)) !== null) {
          const description = (m[3] || "").replace(/ILS\s*[\d,.]+/g, "").trim();
          addLine({
            order_line: m[5],
            sku: m[4],
            product_name: description,
            quantity: m[2].replace(/,/g, ""),
            due_date: normalizePriorityDate(m[1])
          });
        }
      }

      if (!result.lines.length) {
        const chunkRegex = /(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})(.*?)(?=\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}|מחיר כולל|ברקוד הזמנה|תנאי תשלום|$)/g;
        let m;
        while ((m = chunkRegex.exec(tableText)) !== null) {
          const due = m[1];
          let chunk = (m[2] || "").trim();
          if (!/יח/.test(chunk) || /הובלה|עלות הובלה/.test(chunk)) continue;

          const qtyMatch = chunk.match(/יח\s*([\d,]+(?:\.\d+)?)/) || chunk.match(/([\d,]+(?:\.\d+)?)\s*יח/);
          const quantity = qtyMatch ? qtyMatch[1].replace(/,/g, "") : "";

          const skuMatches = Array.from(chunk.matchAll(/\b(\d{6,14}|[A-Z]{1,}[A-Z0-9\-\/.]{2,})\b/g)).map(x => x[1]).filter(x => !/^ILS$/i.test(x));
          const sku = skuMatches.length ? skuMatches[skuMatches.length - 1] : "";
          if (!sku && !quantity) continue;

          let lineNo = "";
          if (sku) {
            const afterSku = chunk.slice(chunk.lastIndexOf(sku) + sku.length);
            const lineMatch = afterSku.match(/\b(\d{1,3})\b/);
            if (lineMatch) lineNo = lineMatch[1];
          }

          let product = chunk;
          product = product.replace(/ILS\s*[\d,.]+/gi, " ").replace(/[\d,.]+\s*ILS/gi, " ");
          product = product.replace(/יח\s*[\d,]+(?:\.\d+)?|[\d,]+(?:\.\d+)?\s*יח/g, " ");
          if (sku) product = product.replace(sku, " ");
          if (lineNo) product = product.replace(new RegExp("\\b" + lineNo + "\\b$"), " ");
          product = product.replace(/\s+/g, " ").trim();

          addLine({
            order_line: lineNo || String(result.lines.length + 1),
            sku,
            product_name: product,
            quantity,
            due_date: normalizePriorityDate(due)
          });
        }
      }

      return result;
    }

    async function readPdfTextFromFile(file) {
      if (!window.pdfjsLib) throw new Error("ספריית PDF לא נטענה. בדוק חיבור אינטרנט ורענן את הדף.");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let fullText = "";
      for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
        const page = await pdf.getPage(pageNo);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + "\n";
      }
      return fullText;
    }

    function normalizeDateInput(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      const m = text.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
      if (m) {
        const y = m[3].length === 2 ? "20" + m[3] : m[3];
        return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
      }
      return "";
    }

    function getTpiOrderNo() { return document.getElementById("tpiOrderNo")?.value.trim() || ""; }
    function getTpiYear2() {
      const d = document.getElementById("tpiOrderDate")?.value;
      if (d && /^\d{4}-/.test(d)) return d.slice(2,4);
      return String(new Date().getFullYear()).slice(-2);
    }
    function buildTpiWorkOrderNo(orderNo) {
      return `${getLastDigits(orderNo, 4)}.${getTpiYear2()}`;
    }
    function buildTpiJobNo(orderNo, lineNo) {
      // Internal unique key per line. Displayed work order number is buildTpiWorkOrderNo(orderNo), without line suffix.
      return `${getLastDigits(orderNo, 4)}.${getTpiYear2()}.${formatLineTwoDigits(lineNo || "1")}`;
    }
    function displayWorkOrderNo(value) {
      const s = String(value || "").trim();
      const m = s.match(/^(\d{4}\.\d{2})/);
      return m ? m[1] : s;
    }
    function buildPrintFileQR(orderNo, fileNo) {
      return `${getLastDigits(orderNo, 4)}.${getTpiYear2()}.F${String(fileNo || 1).padStart(2, "0")}`;
    }
    function parseFileComposition(text) {
      // Supports both formats:
      // 1+1+10+13  => each number is one appearance in the file
      // 1x2, 2x1   => line 1 appears twice, line 2 once
      const raw = String(text || "").trim();
      if (!raw) return [];

      // New preferred format: 1+1+10+13
      if (raw.includes("+")) {
        return raw
          .split("+")
          .map(part => part.trim())
          .filter(Boolean)
          .map(line => ({ line: String(line).replace(/\D/g, "") || String(line), repeats: 1 }))
          .filter(item => item.line);
      }

      // Backward-compatible format: 1x2, 2x1 OR 1:2,2:1
      return raw.split(/[;,\n]/).map(part => part.trim()).filter(Boolean).flatMap(part => {
        const m = part.match(/(\d+)\s*[xX:*]\s*(\d+)/);
        if (m) {
          const line = m[1];
          const repeats = Math.max(1, Number(m[2]) || 1);
          return Array.from({ length: repeats }, () => ({ line, repeats: 1 }));
        }
        const single = part.match(/^\d+$/);
        return single ? [{ line: part, repeats: 1 }] : [];
      });
    }

    function normalizeFileCompositionText(text) {
      const composition = parseFileComposition(text);
      return composition.map(item => item.line).join("+");
    }

    function toNullableNumber(value) {
      if (value === "" || value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }
    function calcTotalWidth(lineWidth, rowsCount) {
      return (Number(lineWidth) || 0) * (Number(rowsCount) || 0);
    }
    function calcPrintWaste(filesCount) {
      const n = Math.max(1, Number(filesCount) || 1);
      if (n === 1) return 150; // first 100 + last 50
      return 100 + Math.max(0, n - 2) * 20 + 50;
    }
    function calcBasePrintMeters(packageType, qty, rowsCount) {
      const q = Number(qty) || 0;
      const rows = Math.max(1, Number(rowsCount) || 1);
      if (packageType === "גליל") return q / rows;
      return q / rows; // for bags, this is still a print-meter base until the Excel formula is fully migrated.
    }
    function calcTotalPrintMeters(packageType, qty, rowsCount, filesCount) {
      return Math.ceil(calcBasePrintMeters(packageType, qty, rowsCount) + calcPrintWaste(filesCount));
    }

    function updateTpiPreview() {

      const filesCount = Math.max(1, tpiPrintFiles.length || 1);
      const packageType = document.getElementById("tpiPackageType")?.value || "גליל";
      const totalWidth = calcTotalWidth(lineWidth, rowsAcross);
      const baseMeters = calcBasePrintMeters(packageType, qty, rowsAcross);
      const waste = calcPrintWaste(filesCount);
      const totalMeters = calcTotalPrintMeters(packageType, qty, rowsAcross, filesCount);
      el.innerHTML = `רוחב כולל: ${totalWidth || 0} מ״מ | בסיס להדפסה: ${Math.ceil(baseMeters || 0)} מ׳ | פחת קבצים: ${waste} מ׳ | סה״כ להדפסה: ${totalMeters || 0} מ׳`;
    }

    function addTpiLine() {
      const orderNo = getTpiOrderNo();
      const lineNo = document.getElementById("tpiLineNo")?.value.trim();
      const customer = document.getElementById("tpiCustomer")?.value.trim();
      const product = document.getElementById("tpiProduct")?.value.trim();
      const qty = document.getElementById("tpiQty")?.value.trim();
      if (!orderNo || !lineNo || !customer || !product || !qty) { document.getElementById("tpiMsg").innerText = "חובה להזין הזמנה, לקוח, שורה, מוצר וכמות"; return; }
      const rowsAcross = Number(document.getElementById("tpiRowsAcross")?.value || 1);
      const lineWidth = Number(document.getElementById("tpiLineWidth")?.value || 0);
      const filesCount = Math.max(1, tpiPrintFiles.length || 1);
      const packageType = document.getElementById("tpiPackageType")?.value || "גליל";
      const graphicInput = document.getElementById("tpiGraphicPdfFile");
      const graphicFile = graphicInput?.files?.[0] || null;
      if (graphicFile && !(/\.pdf$/i.test(graphicFile.name) || graphicFile.type === "application/pdf")) {
        document.getElementById("tpiMsg").innerText = "קובץ גרפי חייב להיות PDF";
        return;
      }
      const graphicFileKey = graphicFile ? `g_${Date.now()}_${Math.random().toString(36).slice(2)}` : "";
      if (graphicFile) tpiLineGraphicFiles[graphicFileKey] = graphicFile;
      const row = {
        order_number: orderNo,
        customer_name: customer,
        customer_po: document.getElementById("tpiCustomerPo")?.value.trim() || "",
        order_line: lineNo,
        sku: document.getElementById("tpiSku")?.value.trim() || "",
        product_name: product,
        quantity: qty,
        due_date: document.getElementById("tpiDueDate")?.value || null,
        work_order_no: buildTpiWorkOrderNo(orderNo),
        job_no: buildTpiJobNo(orderNo, lineNo),
        process_id: normalizeProcessId(document.getElementById("tpiProcessId")?.value || "") || null,
        process_text: getProcessText(document.getElementById("tpiProcessId")?.value || ""),
        package_type: packageType,
        print_side: document.getElementById("tpiPrintSide")?.value || "",
        roll_direction: document.getElementById("tpiRollDirection")?.value || "",
        print_material: getSelectedPrintMaterial(),
        pitch: document.getElementById("tpiPitch")?.value || "",
        line_width: lineWidth,
        rows_across: rowsAcross,
        total_width: calcTotalWidth(lineWidth, rowsAcross),
        base_print_meters: Math.ceil(calcBasePrintMeters(packageType, qty, rowsAcross)),
        print_waste_meters: calcPrintWaste(filesCount),
        total_print_meters: calcTotalPrintMeters(packageType, qty, rowsAcross, filesCount),
        graphic_file_key: graphicFileKey,
        graphic_pdf_name: graphicFile ? graphicFile.name : (currentTpiEditingLineData?.graphic_pdf_name || ""),
        graphic_pdf_path: graphicFile ? "" : (currentTpiEditingLineData?.graphic_pdf_path || ""),

        source_order_line: window.currentTpiSourceOrderLine || currentTpiEditingLineData?.source_order_line || null
      };
      tpiLines.push(row);
      currentTpiEditingLineData = null;
      if (graphicInput) graphicInput.value = "";
      document.getElementById("tpiMsg").innerText = graphicFile ? "שורה נוספה עם PDF גרפי" : "שורה נוספה";
      drawTpiTables();
      updateTpiPreview();

      if (!compositionText) { document.getElementById("tpiMsg").innerText = "חובה להזין הרכב קובץ, לדוגמה 1+1+10+13"; return; }
      if (!printQuantity) { document.getElementById("tpiMsg").innerText = "חובה להזין כמות להדפסה לכל קובץ"; return; }

    function sanitizeStorageFileName(value) {
      const original = String(value || "file.pdf").trim();
      const extMatch = original.match(/\.([A-Za-z0-9]{1,8})$/);
      const ext = extMatch ? "." + extMatch[1].toLowerCase() : "";
      const base = ext ? original.slice(0, -ext.length) : original;
      let safe = base
        .normalize("NFKD")
        .replace(/[\u0590-\u05FF]/g, "") // remove Hebrew chars from Storage key; original name is still saved separately
        .replace(/[^A-Za-z0-9._-]+/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 80);
      if (!safe) safe = "graphic_pdf";
      return safe + (ext || ".pdf");
    }

    function buildPublicGraphicsUrl(filePath) {
      const encodedPath = String(filePath || "").split("/").map(encodeURIComponent).join("/");
      return `${SUPABASE_URL}/storage/v1/object/public/graphics/${encodedPath}`;
    }

    async function uploadGraphicPdfForTpiLine(row) {
      const file = row?.graphic_file_key ? tpiLineGraphicFiles[row.graphic_file_key] : null;
      if (!file) {
        return {
          graphic_pdf_name: row.graphic_pdf_name || "",
          graphic_pdf_path: row.graphic_pdf_path || "",
          graphic_pdf_url: row.graphic_pdf_url || ""
        };
      }

      if (!(/\.pdf$/i.test(file.name) || file.type === "application/pdf")) {
        throw new Error(`הקובץ ${file.name} אינו PDF`);
      }

      const orderPart = sanitizeStorageFileName(row.order_number || "order");
      const jobPart = sanitizeStorageFileName(row.job_no || row.order_line || "line");
      const fileName = `${Date.now()}-${sanitizeStorageFileName(file.name)}`;
      const filePath = `${orderPart}/${jobPart}/${fileName}`;

      const { error } = await client.storage.from("graphics").upload(filePath, file, {
        cacheControl: "3600",
        upsert: true,
        contentType: "application/pdf"
      });
      if (error) throw new Error("שגיאה בהעלאת PDF גרפי. יש להריץ SQL של V34 ולוודא bucket בשם graphics. " + error.message);

      return {
        graphic_pdf_name: file.name,
        graphic_pdf_path: filePath,
        graphic_pdf_url: buildPublicGraphicsUrl(filePath)
      };
    }

    async function saveTpiPrintPlan() {
      const msg = document.getElementById("tpiMsg");
      if (!tpiLines.length) { msg.innerText = "חובה להוסיף לפחות שורת הזמנה אחת"; return; }
      if (!tpiPrintFiles.length) { msg.innerText = "חובה להוסיף לפחות קובץ הדפסה אחד"; return; }
      const orderNo = getTpiOrderNo();
      const orderPayload = {
        order_number: orderNo,
        work_order_no: buildTpiWorkOrderNo(orderNo),
        customer_name: document.getElementById("tpiCustomer")?.value.trim() || "",
        customer_po: document.getElementById("tpiCustomerPo")?.value.trim() || "",
        order_date: document.getElementById("tpiOrderDate")?.value || null,
        source: "order_lines_v34_4",
        status: "פתוחה לדפוס",
        planned_by: document.getElementById("tpiPlannedBy")?.value.trim() || currentEmployee?.name || "",
        job_type: document.getElementById("tpiJobType")?.value || "",
        approval_source: document.getElementById("tpiApprovalSource")?.value || "",
        tpi_notes: document.getElementById("tpiNotes")?.value || "",
        released_to_print_at: new Date().toISOString()
      };
      msg.innerText = "שומר נתוני תפ״י...";
      const { error: orderError } = await client.from("tpi_orders").upsert(orderPayload, { onConflict: "order_number" });
      if (orderError) { msg.innerText = "שגיאה בשמירת tpi_orders. יש להריץ SQL של V33: " + orderError.message; return; }

      function nullIfBlankNumber(value) {
        if (value === "" || value === null || value === undefined) return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }
      const uploadedTpiLines = [];
      try {
        for (const line of tpiLines) {
          const graphicData = await uploadGraphicPdfForTpiLine(line);
          uploadedTpiLines.push({ ...line, ...graphicData });
        }
      } catch (e) {
        msg.innerText = e.message;
        return;
      }

      if (currentTpiEditMode) {
        await client.from("tpi_order_lines").delete().eq("order_number", orderNo);
        await client.from("print_files").delete().eq("order_number", orderNo);
      }

      const lineJobNoCounts = {};
      uploadedTpiLines.forEach(r => {
        const key = String(r.job_no || "");
        lineJobNoCounts[key] = (lineJobNoCounts[key] || 0) + 1;
      });
      const lineJobNoSeen = {};
      const linesPayload = uploadedTpiLines.map(r => {
        const baseJobNo = String(r.job_no || buildTpiJobNo(r.order_number, r.order_line));
        lineJobNoSeen[baseJobNo] = (lineJobNoSeen[baseJobNo] || 0) + 1;
        const uniqueJobNo = lineJobNoCounts[baseJobNo] > 1 ? `${baseJobNo}.${String(lineJobNoSeen[baseJobNo]).padStart(2, "0")}` : baseJobNo;
        const { graphic_file_key, ...restRow } = r;
        const dbRow = { ...restRow, job_no: uniqueJobNo };
        return {
          ...dbRow,
          due_date: r.due_date || null,
          process_id: r.process_id === "" || r.process_id === undefined ? null : r.process_id,
          pitch: nullIfBlankNumber(r.pitch),
          line_width: nullIfBlankNumber(r.line_width),
          rows_across: nullIfBlankNumber(r.rows_across),
          total_width: nullIfBlankNumber(r.total_width),
          base_print_meters: nullIfBlankNumber(r.base_print_meters),
          print_waste_meters: nullIfBlankNumber(r.print_waste_meters),
          total_print_meters: nullIfBlankNumber(r.total_print_meters),
          raw_data: { ...dbRow }
        };
      });
      const { error: linesError } = await client.from("tpi_order_lines").upsert(linesPayload, { onConflict: "job_no" });
      if (linesError) { msg.innerText = "שגיאה בשמירת tpi_order_lines. יש להריץ SQL של V34: " + linesError.message; return; }
      tpiLines = uploadedTpiLines.map(r => ({ ...r, graphic_file_key: "" }));
      tpiLineGraphicFiles = {};
      drawTpiTables();

      const filesPayload = tpiPrintFiles.map(f => ({
        order_number: f.order_number,
        qr_code: f.qr_code,
        file_no: toNullableNumber(f.file_no),
        file_name: f.file_name,
        composition_text: f.composition_text,
        composition: f.composition,
        print_quantity: toNullableNumber(f.print_quantity),
        status: f.status || "ממתין לדפוס"
      }));
      const { error: filesError } = await client.from("print_files").upsert(filesPayload, { onConflict: "qr_code" });
      if (filesError) { msg.innerText = "שגיאה בשמירת print_files. יש להריץ SQL של V33: " + filesError.message; return; }

      currentTpiEditMode = false;
      currentTpiEditOrderNo = "";
      msg.innerHTML = `
        <div class="bg-green-900/40 border border-green-700 rounded-2xl p-4">
          <div class="font-bold text-green-200 mb-3">נשמר בהצלחה: ${tpiLines.length} שורות ו-${tpiPrintFiles.length} קבצי הדפסה</div>
          <div class="grid md:grid-cols-3 gap-3">
            <button onclick="renderTpiOrderDetails('${escapeHtml(orderNo)}')" class="bg-blue-600 p-3 rounded-xl font-bold">צפייה בפק״ע</button>
            <button onclick="renderTpiWorkOrders('open')" class="bg-purple-600 p-3 rounded-xl font-bold">פק״עות פתוחות</button>
            <button onclick="renderNewTpiPrintPlanner()" class="bg-gray-700 p-3 rounded-xl font-bold">פק״ע חדשה</button>
          </div>
        </div>`;
      drawTpiQrLabels(true);
    }

      try { q = getPrintQualityPayload(null); } catch (e) { msg.innerText = e.message; return; }
      const { data: job, error } = await client.from("jobs").insert({
        order_number: currentPrintFileData.order_number,
        employee_id: currentEmployee.id,
        batch_number: currentPrintFileData.qr_code,
        start_time: new Date().toISOString(),
        status: "open",
        department: "דפוס"
      }).select().single();
      if (error) { msg.innerText = "שגיאה ביצירת עבודת דפוס: " + error.message; return; }
      currentPrintJob = job;
      q.job_id = job.id;
      const { error: qError } = await client.from("print_quality").insert(q);
      if (qError) { msg.innerText = "שגיאה בשמירת בקרת איכות דפוס. יש להריץ SQL של V33: " + qError.message; return; }
      renderActivePrintJob();
    }

    // ===============================

    // פק״ע אחת, כמה קבצי הדפסה, בקרת איכות לכל קובץ בנפרד
    // ===============================

    let currentPrintOrderData = null;
    let currentV35PrintFile = null;

    function isPrintFileClosedStatus(status) {
      const s = String(status || "").trim();
      return ["הושלם", "נסגר בחריגה", "completed", "completed_with_exception"].includes(s);
    }

    function isPrintOrderVisibleForPrint(status) {
      const s = String(status || "").trim();
      return s === "פתוחה לדפוס" || s === "בדפוס" || s === "" || s.toLowerCase() === "ready_for_print" || s.toLowerCase() === "in_print";
    }

    function getFileRequiredQty(file) {
      return Number(file?.print_quantity ?? file?.required_print_quantity ?? file?.required_quantity ?? 0) || 0;
    }

    function getFileActualQty(file) {
      return Number(file?.actual_print_quantity ?? file?.actual_quantity ?? 0) || 0;
    }

    async function fetchPrintStationOrders() {
      const rows = await fetchTpiWorkOrders("open");
      return rows.filter(r => isPrintOrderVisibleForPrint(r.status));
    }

    async function renderPrintWorkStart() {
      page(`

    function drawPrintStationOrders(rows) {

          <tbody>${rows.map(r => `<tr>

    async function loadPrintOrderByQrV35() {
      const qr = document.getElementById("manualPrintQr")?.value.trim();

      if (!qr) { msg.innerText = "הקלד QR קובץ הדפסה"; return; }

    async function renderPrintOrderStation(orderNumber, focusQr = "") {
      page(`
        ${topBar("דפוס — פק״ע", `פק״ע: ${orderNumber}`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">

            <button onclick="renderStartForm()" class="bg-gray-700 px-4 py-3 rounded-2xl font-bold">חזור</button>
          </div>
          <div id="printOrderStationBox" class="text-gray-300">טוען פק״ע...</div>
        </section>`);
      try {
        currentPrintOrderData = await getFullTpiOrder(orderNumber);
        drawPrintOrderStation(currentPrintOrderData, focusQr);
      } catch (e) {
        document.getElementById("printOrderStationBox").innerHTML = `<p class="text-red-400">שגיאה בטעינת פק״ע: ${escapeHtml(e.message)}</p>`;
      }
    }

    function getLinesForPrintFile(order, file) {
      const lineMap = new Map((order.lines || []).map(l => [String(l.order_line), l]));
      const composition = Array.isArray(file.composition) ? file.composition : parseFileComposition(file.composition_text);
      const seen = [];
      composition.forEach(c => {
        const line = lineMap.get(String(c.line));
        if (line && !seen.find(x => String(x.order_line) === String(line.order_line))) seen.push(line);
      });
      return seen;
    }

    function renderPdfLinksForPrintFile(order, file) {
      const lines = getLinesForPrintFile(order, file);
      const links = lines.filter(l => l.graphic_pdf_url).map(l => `<a href="${escapeHtml(l.graphic_pdf_url)}" target="_blank" class="inline-block bg-blue-700 px-3 py-2 rounded-xl text-xs font-bold mr-1 mb-1">PDF שורה ${escapeHtml(l.order_line)}</a>`);
      return links.length ? links.join("") : `<span class="text-gray-400">אין PDF מצורף לשורות הקובץ</span>`;
    }

      const el = document.getElementById("printOrderStationBox");
      if (!el) return;

      const allDone = files.length && files.every(f => isPrintFileClosedStatus(f.status));
      el.innerHTML = `
        <div class="grid md:grid-cols-4 gap-3">
          <div class="bg-gray-800/60 border border-gray-700 rounded-2xl p-4"><div class="text-gray-400 text-sm">פק״ע</div><div class="font-bold text-xl ltr">${escapeHtml(o.job_no_display)}</div></div>
          <div class="bg-gray-800/60 border border-gray-700 rounded-2xl p-4"><div class="text-gray-400 text-sm">לקוח</div><div class="font-bold text-xl">${escapeHtml(o.customer_name)}</div></div>
          <div class="bg-gray-800/60 border border-gray-700 rounded-2xl p-4"><div class="text-gray-400 text-sm">סטטוס</div><div class="font-bold text-xl">${escapeHtml(o.status || "פתוחה לדפוס")}</div></div>
          <div class="bg-gray-800/60 border border-gray-700 rounded-2xl p-4"><div class="text-gray-400 text-sm">קבצים</div><div class="font-bold text-xl">${escapeHtml(files.length)}</div></div>
        </div>

        <h3 class="text-xl font-bold mt-5 mb-3">שורות פק״ע</h3>
        <div class="overflow-auto">${renderTpiLinesMiniTable(o.lines || [])}</div>

        <h3 class="text-xl font-bold mt-5 mb-3">קבצי הדפסה — בקרת איכות לכל קובץ</h3>
        <div class="overflow-auto">
          <table class="w-full text-sm border-collapse">
            <thead><tr>${["פעולה","קובץ","שם קובץ","הרכב","כמות נדרשת","כמות בפועל","סטטוס","PDF גרפי"].map(h => `<th class="border border-gray-700 p-2 bg-gray-800 whitespace-nowrap">${h}</th>`).join("")}</tr></thead>
            <tbody>${files.map(f => {
              const status = f.status || "ממתין לדפוס";
              const isDone = isPrintFileClosedStatus(status);
              const inPrint = String(status).trim() === "בדפוס";
              const action = isDone
                ? `<span class="text-green-300 font-bold">סגור</span>`
                : inPrint
                  ? `<button onclick="renderFinishPrintFileV35('${escapeHtml(o.order_number)}','${escapeHtml(f.qr_code)}')" class="bg-green-600 px-3 py-2 rounded-xl text-xs font-bold">סיום קובץ</button>`
                  : `<button onclick="renderPrintFileQualityV35('${escapeHtml(o.order_number)}','${escapeHtml(f.qr_code)}')" class="bg-orange-600 px-3 py-2 rounded-xl text-xs font-bold">בקרת איכות / התחלה</button>`;
              const rowClass = focusQr && focusQr === f.qr_code ? "bg-orange-900/25" : "";
              return `<tr class="${rowClass}">
                <td class="border border-gray-700 p-2 whitespace-nowrap">${action}</td>
                <td class="border border-gray-700 p-2 whitespace-nowrap">F${String(f.file_no || "").padStart(2,"0")}</td>
                <td class="border border-gray-700 p-2">${escapeHtml(f.file_name || "")}</td>
                <td class="border border-gray-700 p-2 ltr">${escapeHtml(f.composition_text || "")}</td>
                <td class="border border-gray-700 p-2 font-bold">${escapeHtml(getFileRequiredQty(f))}</td>
                <td class="border border-gray-700 p-2">${escapeHtml(getFileActualQty(f) || "")}</td>
                <td class="border border-gray-700 p-2">${escapeHtml(status)}</td>
                <td class="border border-gray-700 p-2 min-w-[180px]">${renderPdfLinksForPrintFile(o, f)}</td>
              </tr>`;
            }).join("")}</tbody>
          </table>
        </div>
        ${allDone ? `<button onclick="closeTpiOrderAfterPrint('${escapeHtml(o.order_number)}')" class="w-full bg-green-700 p-4 rounded-2xl font-bold mt-4">סגור פק״ע</button>` : `<p class="text-gray-400 mt-4">הפק״ע תיסגר רק לאחר שכל קבצי ההדפסה הושלמו או נסגרו בחריגה.</p>`}
      `;
    }

    function findFileInCurrentPrintOrder(qrCode) {
      return (currentPrintOrderData?.files || []).find(f => String(f.qr_code) === String(qrCode));
    }

    async function renderPrintFileQualityV35(orderNumber, qrCode) {
      try {
        if (!currentPrintOrderData || String(currentPrintOrderData.order_number) !== String(orderNumber)) currentPrintOrderData = await getFullTpiOrder(orderNumber);
        currentV35PrintFile = findFileInCurrentPrintOrder(qrCode);
        if (!currentV35PrintFile) throw new Error("לא נמצא קובץ הדפסה בפק״ע");
      } catch (e) { alert(e.message); return; }
      const lines = getLinesForPrintFile(currentPrintOrderData, currentV35PrintFile);
      page(`
        ${topBar("בקרת איכות דפוס", `קובץ: ${currentV35PrintFile.qr_code}`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">
          <div class="bg-blue-900/30 border border-blue-700 rounded-2xl p-4">
            <div>פק״ע: <span class="ltr font-bold">${escapeHtml(currentPrintOrderData.job_no_display)}</span></div>
            <div>לקוח: ${escapeHtml(currentPrintOrderData.customer_name || "")}</div>
            <div>קובץ: F${String(currentV35PrintFile.file_no || "").padStart(2,"0")} — ${escapeHtml(currentV35PrintFile.file_name || "")}</div>
            <div>הרכב שורות: <span class="ltr">${escapeHtml(currentV35PrintFile.composition_text || "")}</span></div>
            <div>כמות נדרשת: <b>${escapeHtml(getFileRequiredQty(currentV35PrintFile))}</b></div>

          <div class="bg-gray-800/50 border border-gray-700 rounded-2xl p-4">
            <h3 class="font-bold text-lg mb-3">צילום תווית חומר גלם בתחילת ריצה</h3>
            <div class="dg-field"><label>תווית חו״ג — חובה</label><input id="printRawMaterialLabel" type="file" accept="image/*" capture="environment"></div>
          </div>
          <div class="bg-gray-800/50 border border-gray-700 rounded-2xl p-4">
            <h3 class="font-bold text-lg mb-3">צילומי בקרת גרפיקה — הכנה ל-AI</h3>
            <p class="text-gray-400 text-sm mb-3">לא חובה כרגע. התמונות נשמרות לדוח ולהשוואת PDF בשלב הבא.</p>
            <div class="grid md:grid-cols-4 gap-3">
              <div class="dg-field"><label>אזור 1</label><input id="aiCheckPhoto1" type="file" accept="image/*" capture="environment"></div>

          ${fieldSelect("pq_material_match", "התאמת חומר להוראות תפ״י", ["כן", "לא"])}
          ${fieldSelect("pq_pdf_match", "התאמה ל-PDF / גרפיקה", ["כן", "לא"])}

          ${fieldNumber("pq_pitch", "פסיעה בפועל")}
          ${fieldSelect("pq_print_side", "פנימי / חיצוני", PRINT_SIDES)}
          ${fieldSelect("pq_roll_direction", "כיוון גלגול", ROLL_DIRECTIONS)}
          ${fieldSelect("pq_barcode_readable", "ברקוד קריא", ["כן", "לא", "לא רלוונטי"])}

          <button onclick="renderPrintOrderStation('${escapeHtml(orderNumber)}')" class="w-full bg-gray-700 p-4 rounded-2xl font-bold">חזור לפק״ע</button>
          <p id="printQualityMsg" class="text-yellow-300"></p>

    }

    function getPrintQualityPayloadV35(jobId) {
      const required = ["pq_material_match", "pq_pdf_match", "pq_width", "pq_pitch", "pq_print_side", "pq_roll_direction", "pq_barcode_readable", "pq_print_cleanliness"];
      for (const id of required) if (!document.getElementById(id).value) throw new Error("יש למלא את כל שדות בקרת האיכות בדפוס");
      return {
        job_id: jobId,
        print_file_qr: currentV35PrintFile?.qr_code || "",
        order_number: currentPrintOrderData?.order_number || "",
        file_no: toNullableNumber(currentV35PrintFile?.file_no),
        material_match: document.getElementById("pq_material_match").value === "כן",
        pdf_match: document.getElementById("pq_pdf_match").value === "כן",
        width: Number(document.getElementById("pq_width").value),
        pitch: Number(document.getElementById("pq_pitch").value),
        print_side: document.getElementById("pq_print_side").value,
        roll_direction: document.getElementById("pq_roll_direction").value,
        print_cleanliness: document.getElementById("pq_print_cleanliness").value,
        barcode_value: document.getElementById("pq_barcode_readable").value,
        comments: document.getElementById("pq_comments").value,
        approved: true
      };
    }

    async function startPrintFileAfterQualityV35(orderNumber, qrCode) {
      const msg = document.getElementById("printQualityMsg");
      let q;
      try { q = getPrintQualityPayloadV35(null); } catch (e) { msg.innerText = e.message; return; }
      const rawMaterialFile = document.getElementById("printRawMaterialLabel")?.files?.[0] || null;
      if (!rawMaterialFile) { msg.innerText = "חובה לצלם תווית חומר גלם בתחילת ריצה"; return; }
      msg.innerText = "שומר בקרת איכות ומתחיל קובץ...";
      const { data: job, error } = await client.from("jobs").insert({
        order_number: orderNumber,
        employee_id: currentEmployee.id,
        batch_number: qrCode,
        start_time: new Date().toISOString(),
        status: "open",
        department: "דפוס"
      }).select().single();
      if (error) { msg.innerText = "שגיאה ביצירת עבודת דפוס: " + error.message; return; }
      await saveLabel(rawMaterialFile, job.id, qrCode, "print_start");
      for (let i = 1; i <= 4; i++) {
        const aiFile = document.getElementById("aiCheckPhoto" + i)?.files?.[0] || null;
        if (aiFile) await saveLabel(aiFile, job.id, qrCode, "print_ai_" + i);
      }
      q.job_id = job.id;
      const { error: qError } = await client.from("print_quality").insert(q);
      if (qError) { msg.innerText = "שגיאה בשמירת בקרת איכות דפוס. יש להריץ SQL של V33: " + qError.message; return; }
      const { error: fileError } = await client.from("print_files").update({
        status: "בדפוס",
        started_at: new Date().toISOString(),
        started_by: currentEmployee?.name || "",
        operator_2: document.getElementById("pq_operator2")?.value || ""
      }).eq("qr_code", qrCode);
      if (fileError) { msg.innerText = "שגיאה בעדכון סטטוס קובץ. יש להריץ SQL של V35: " + fileError.message; return; }
      await client.from("tpi_orders").update({ status: "בדפוס" }).eq("order_number", orderNumber);

    async function finishPrintFileV35(orderNumber, qrCode) {
      const msg = document.getElementById("finishPrintMsg");
      const requiredQty = getFileRequiredQty(currentV35PrintFile);
      const actualQty = Number(document.getElementById("actualPrintQty")?.value || 0);
      const reason = document.getElementById("printExceptionReason")?.value.trim() || "";
      if (!actualQty) { msg.innerText = "חובה להזין כמות בפועל"; return; }
      const isShort = actualQty < requiredQty;
      if (isShort && !reason) { msg.innerText = "הכמות בפועל קטנה מהנדרש. חובה לרשום סיבת חריגה או להמשיך ייצור."; return; }
      const newStatus = isShort ? "נסגר בחריגה" : "הושלם";
      const { error } = await client.from("print_files").update({
        status: newStatus,
        actual_print_quantity: actualQty,
        completed_at: new Date().toISOString(),
        completed_by: currentEmployee?.name || "",
        exception_reason: isShort ? reason : ""
      }).eq("qr_code", qrCode);
      if (error) { msg.innerText = "שגיאה בסיום קובץ. יש להריץ SQL של V35: " + error.message; return; }

      await client.from("jobs").update({
        end_time: new Date().toISOString(),
        status: "closed",
        transfer_meters: actualQty,
        finish_comments: isShort ? `נסגר בחריגה: ${reason}` : ""
      }).eq("batch_number", qrCode).eq("department", "דפוס").eq("status", "open");

      const order = await getFullTpiOrder(orderNumber);
      const allDone = (order.files || []).every(f => String(f.qr_code) === String(qrCode) ? true : isPrintFileClosedStatus(f.status));
      if (allDone) {
        await client.from("tpi_orders").update({ status: "סגורה", closed_at: new Date().toISOString(), closed_by: currentEmployee?.name || "" }).eq("order_number", orderNumber);
      } else {
        await client.from("tpi_orders").update({ status: "בדפוס" }).eq("order_number", orderNumber);
      }
      await renderPrintOrderStation(orderNumber, qrCode);
    }

    let tpiWorkOrdersCache = [];

    function isClosedTpiStatus(status) {
      const s = String(status || "").trim();
      return s === "סגורה" || s === "בוטלה" || s.toLowerCase() === "closed" || s.toLowerCase() === "cancelled";
    }

    function formatDateTimeHe(value) {
      if (!value) return "";
      try { return new Date(value).toLocaleString("he-IL"); } catch(e) { return String(value || ""); }
    }

    function summarizeTpiOrder(order, lines, files) {
      const orderLines = (lines || []).filter(l => String(l.order_number) === String(order.order_number));
      const orderFiles = (files || []).filter(f => String(f.order_number) === String(order.order_number));
      const firstLine = orderLines[0] || {};
      const uniq = arr => [...new Set(arr.map(x => String(x || "").trim()).filter(Boolean))];
      const materials = uniq(orderLines.map(l => l.print_material)).join(" / ");
      const packageTypes = uniq(orderLines.map(l => l.package_type)).join(" / ");
      const filesMeters = orderFiles.reduce((sum, f) => sum + (Number(f.print_quantity) || 0), 0);
      const totalMeters = filesMeters || orderLines.reduce((sum, l) => sum + (Number(l.total_print_meters) || 0), 0);
      const totalWidth = Math.max(0, ...orderLines.map(l => Number(l.total_width) || 0));
      const rowsAcross = uniq(orderLines.map(l => l.rows_across)).join(" / ");
      return {
        ...order,
        job_no_display: order.work_order_no || firstLine.work_order_no || displayWorkOrderNo(firstLine.job_no || order.order_number || ""),
        package_type_display: packageTypes,
        material_display: materials,
        total_print_meters_display: totalMeters || "",
        total_width_display: totalWidth || "",
        rows_across_display: rowsAcross,
        print_files_count: orderFiles.length,
        lines: orderLines,
        files: orderFiles
      };
    }

    async function fetchTpiWorkOrders(mode = "open") {
      const { data: orders, error: ordersError } = await client
        .from("tpi_orders")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(500);
      if (ordersError) throw ordersError;

      const orderNumbers = (orders || []).map(o => o.order_number).filter(Boolean);
      let lines = [];
      let files = [];
      if (orderNumbers.length) {
        const { data: linesData, error: linesError } = await client.from("tpi_order_lines").select("*").in("order_number", orderNumbers);
        if (linesError) throw linesError;
        lines = linesData || [];
        const { data: filesData, error: filesError } = await client.from("print_files").select("*").in("order_number", orderNumbers);
        if (filesError) throw filesError;
        files = filesData || [];
      }

      const summarized = (orders || []).map(o => summarizeTpiOrder(o, lines, files));
      return summarized.filter(o => mode === "closed" ? isClosedTpiStatus(o.status) : !isClosedTpiStatus(o.status));
    }

    async function getFullTpiOrder(orderNumber) {
      const { data: order, error: orderError } = await client.from("tpi_orders").select("*").eq("order_number", orderNumber).maybeSingle();
      if (orderError) throw orderError;
      const { data: lines, error: linesError } = await client.from("tpi_order_lines").select("*").eq("order_number", orderNumber).order("order_line", { ascending: true });
      if (linesError) throw linesError;
      const { data: files, error: filesError } = await client.from("print_files").select("*").eq("order_number", orderNumber).order("file_no", { ascending: true });
      if (filesError) throw filesError;
      return summarizeTpiOrder(order || { order_number: orderNumber }, lines || [], files || []);
    }

    async function loadReport(period) {
      updatePeriodButtons(period);
      const { start, end } = getDateRange(period);
      document.getElementById("reportSummary").innerText = "טוען דוח...";

      const { data: jobs, error } = await client
        .from("jobs")
        .select("*, employees(name)")
        .gte("created_at", start)
        .lte("created_at", end)
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("reportTable").innerHTML = `<p class="text-red-400">${escapeHtml(error.message)}</p>`;
        document.getElementById("reportSummary").innerText = "שגיאה בטעינת דוח";
        return;
      }

      const jobIds = (jobs || []).map(j => j.id).filter(Boolean);
      let labelsByJob = {};
      let qualityByJob = {};
      let printFilesByQr = {};
      let rollLabelsByQr = {};

      if (jobIds.length) {
        const { data: labels, error: labelsError } = await client
          .from("material_labels")
          .select("*")
          .in("job_id", jobIds);

        if (!labelsError && labels) {
          labels.forEach(label => {
            if (!labelsByJob[label.job_id]) labelsByJob[label.job_id] = [];
            labelsByJob[label.job_id].push(label);
          });
        }

        const { data: qualityRows, error: qualityError } = await client
          .from("lamination_quality")
          .select("*")
          .in("job_id", jobIds);

        if (!qualityError && qualityRows) {
          qualityRows.forEach(q => {
            if (!qualityByJob[q.job_id]) qualityByJob[q.job_id] = { ...q, _quality_type: "lamination" };
          });
        }

        const { data: printQualityRows, error: printQualityError } = await client
          .from("print_quality")
          .select("*")
          .in("job_id", jobIds);

        if (!printQualityError && printQualityRows) {
          printQualityRows.forEach(q => {
            qualityByJob[q.job_id] = { ...q, _quality_type: "print" };
          });
        }
      }

      const printQrs = (jobs || []).filter(j => String(j.department || "").includes("דפוס")).map(j => j.batch_number).filter(Boolean);
      if (printQrs.length) {
        const { data: printFileRows } = await client.from("print_files").select("*").in("qr_code", printQrs);
        (printFileRows || []).forEach(f => { printFilesByQr[f.qr_code] = f; });
        const { data: rollRows } = await client.from("roll_labels").select("*").in("order_number", printQrs);
        (rollRows || []).forEach(r => {
          if (!rollLabelsByQr[r.order_number]) rollLabelsByQr[r.order_number] = [];
          rollLabelsByQr[r.order_number].push(r);
        });
      }

      function getLabelUrl(label) {
        return label.image_url || (label.file_path ? buildPublicLabelUrl(label.file_path) : "");
      }

      reportRows = (jobs || []).map(job => {
        const labels = labelsByJob[job.id] || [];
        const quality = qualityByJob[job.id] || {};
        const printFile = printFilesByQr[job.batch_number] || {};
        const rollRows = rollLabelsByQr[job.batch_number] || [];
        const rollLinks = rollRows.map(r => r.qr_code || "").filter(Boolean);

        const startLabels = labels.filter(l => l.label_type === "start" || l.label_type === "print_start").map(getLabelUrl).filter(Boolean);
        const aiLabels = labels.filter(l => String(l.label_type || "").startsWith("print_ai_")).map(getLabelUrl).filter(Boolean);
        const extraLabels = labels.filter(l => !["start", "print_start"].includes(l.label_type) && !String(l.label_type || "").startsWith("print_ai_")).map(getLabelUrl).filter(Boolean);
        const allLabelLinks = [...startLabels, ...extraLabels, ...aiLabels].filter(Boolean);

        return {
          "תאריך": job.created_at ? new Date(job.created_at).toLocaleDateString("he-IL") : "",
          "שעת התחלה": job.start_time ? new Date(job.start_time).toLocaleTimeString("he-IL") : "",
          "שעת סיום": job.end_time ? new Date(job.end_time).toLocaleTimeString("he-IL") : "",
          "שם מפעיל": job.employees?.name || "",
          "תהליך": job.department || "למינציה",
          "פק״ע": job.batch_number || job.order_number || "",
          "כמות מטרים להעברה": job.transfer_meters || "",
          "קובץ דפוס": printFile.qr_code || (String(job.department || "").includes("דפוס") ? job.batch_number : ""),
          "כמות נדרשת דפוס": printFile.print_quantity || printFile.required_print_quantity || "",
          "כמות בפועל דפוס": printFile.actual_print_quantity || job.transfer_meters || "",
          "סטטוס קובץ דפוס": printFile.status || "",
          "סיבת חריגה דפוס": printFile.exception_reason || job.finish_comments || "",

          "כיוון למינט": quality.laminate_direction || "",
          "התאמת חו״ג לפק״ע": quality.raw_material_match === true ? "כן" : (quality.raw_material_match === false ? "לא" : ""),
          "עובי": quality.thickness ?? "",
          "רוחב": quality.width ?? "",
          "פסיעה": quality.pitch ?? "",
          "ניקיון הדפסה": quality.print_cleanliness || "",
          "חומר": quality.material_color || "",
          "גימור": quality.finish_type || "",
          "חוזק למינציה": quality.lamination_strength || "",
          "חוזק הלחמה": quality.sealing_strength || "",
          "מהירות עבודה": quality.work_speed ?? "",
          "טמפ׳ תוף": quality.drum_temperature ?? "",
          "טמפ׳ תוף כניסה": quality.inlet_drum_temperature ?? "",
          "הערות איכות": quality.comments || "",
          "אושר איכות": quality.approved === true ? "כן" : (quality.approved === false ? "לא" : ""),

          "דפוס - חומר מתאים": quality._quality_type === "print" ? (quality.material_match === true ? "כן" : (quality.material_match === false ? "לא" : "")) : "",
          "דפוס - התאמה ל-PDF": quality._quality_type === "print" ? (quality.pdf_match === true ? "כן" : (quality.pdf_match === false ? "לא" : "")) : "",
          "דפוס - רוחב בפועל": quality._quality_type === "print" ? (quality.width ?? "") : "",
          "דפוס - פסיעה בפועל": quality._quality_type === "print" ? (quality.pitch ?? "") : "",
          "דפוס - פנים/חוץ": quality._quality_type === "print" ? (quality.print_side || "") : "",
          "דפוס - כיוון גלגול": quality._quality_type === "print" ? (quality.roll_direction || "") : "",
          "דפוס - ברקוד קריא": quality._quality_type === "print" ? (quality.barcode_value || "") : "",
          "דפוס - ניקיון הדפסה": quality._quality_type === "print" ? (quality.print_cleanliness || "") : "",
          "דפוס - הערות איכות": quality._quality_type === "print" ? (quality.comments || "") : "",

          "מספר תוויות חו״ג": allLabelLinks.length,
          "תווית חו״ג ראשית": startLabels[0] || allLabelLinks[0] || "",
          "כל תוויות חו״ג": allLabelLinks.join(" | "),
          "תמונות AI": aiLabels.join(" | "),
          "תוויות גליל דפוס": rollLinks.join(" | ")
        };
      });

      document.getElementById("reportSummary").innerText = `${currentPeriodName}: נמצאו ${reportRows.length} רשומות`;
      drawReportTable(reportRows);
    }

    function drawReportTable(rows) {
      const cols = ['תאריך', 'שעת התחלה', 'שעת סיום', 'שם מפעיל', 'תהליך', 'פק״ע', 'כמות מטרים להעברה', 'קובץ דפוס', 'כמות נדרשת דפוס', 'כמות בפועל דפוס', 'סטטוס קובץ דפוס', 'סיבת חריגה דפוס', 'כיוון למינט', 'התאמת חו״ג לפק״ע', 'עובי', 'רוחב', 'פסיעה', 'ניקיון הדפסה', 'חומר', 'גימור', 'חוזק למינציה', 'חוזק הלחמה', 'מהירות עבודה', 'טמפ׳ תוף', 'טמפ׳ תוף כניסה', 'הערות איכות', 'אושר איכות', 'דפוס - חומר מתאים', 'דפוס - התאמה ל-PDF', 'דפוס - רוחב בפועל', 'דפוס - פסיעה בפועל', 'דפוס - פנים/חוץ', 'דפוס - כיוון גלגול', 'דפוס - ברקוד קריא', 'דפוס - ניקיון הדפסה', 'דפוס - הערות איכות', 'מספר תוויות חו״ג', 'תווית חו״ג ראשית', 'כל תוויות חו״ג', 'תמונות AI', 'תוויות גליל דפוס'];
      if (!rows.length) {
        document.getElementById("reportTable").innerHTML = "אין נתונים לתקופה שנבחרה";
        return;
      }

      function renderLabelButtons(value) {
        const links = String(value || "").split(" | ").filter(Boolean);
        if (!links.length) return "";
        return `<div class="flex gap-2 flex-wrap min-w-[220px]">${links.map((url, i) => `
          <a class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl font-bold whitespace-nowrap"
             href="${url}"
             target="_blank"
             rel="noopener noreferrer">
            פתח תווית ${i + 1}
          </a>
        `).join("")}</div>`;
      }

      function renderCell(col, value, row) {
        if (["תווית חו״ג ראשית", "כל תוויות חו״ג", "תמונות AI"].includes(col)) return renderLabelButtons(value);
        if (col === "תוויות גליל דפוס") return escapeHtml(value || "");
        return escapeHtml(value || "");
      }

      document.getElementById("reportTable").innerHTML = `
        <table class="w-full text-sm border-collapse">
          <thead><tr>${cols.map(c => `<th class="border border-gray-700 p-2 bg-gray-800 whitespace-nowrap">${c}</th>`).join("")}</tr></thead>
          <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="border border-gray-700 p-2 align-top whitespace-nowrap">${renderCell(c, r[c], r)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
    }

    function exportExcel() {
      if (!reportRows.length) { alert("אין נתונים לייצוא"); return; }
      const headers = Object.keys(reportRows[0] || {});

      const excelRows = reportRows.map(row => {
        const newRow = { ...row };
        if (newRow["תווית חו״ג ראשית"]) newRow["תווית חו״ג ראשית"] = "פתח תווית ראשית";
        if (newRow["כל תוויות חו״ג"]) {
          const count = String(row["כל תוויות חו״ג"]).split(" | ").filter(Boolean).length;
          newRow["כל תוויות חו״ג"] = `פתח ${count} תוויות`;
        }
        if (newRow["תמונות AI"]) {
          const count = String(row["תמונות AI"]).split(" | ").filter(Boolean).length;
          newRow["תמונות AI"] = `פתח ${count} תמונות`;
        }
        return newRow;
      });

      const ws = XLSX.utils.json_to_sheet(excelRows, { header: headers });

      reportRows.forEach((row, idx) => {
        const excelRowIndex = idx + 1;
        const mainUrl = row["תווית חו״ג ראשית"];
        const allUrls = String(row["כל תוויות חו״ג"] || "").split(" | ").filter(Boolean);

        if (mainUrl) {
          const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex, c: headers.indexOf("תווית חו״ג ראשית") });
          ws[cellAddress] = { t: "s", v: "פתח תווית ראשית", l: { Target: mainUrl, Tooltip: mainUrl } };
        }

        if (allUrls.length) {
          const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex, c: headers.indexOf("כל תוויות חו״ג") });
          ws[cellAddress] = { t: "s", v: `פתח ${allUrls.length} תוויות`, l: { Target: allUrls[0], Tooltip: allUrls.join(" | ") } };
        }
        const aiUrls = String(row["תמונות AI"] || "").split(" | ").filter(Boolean);
        if (aiUrls.length && headers.indexOf("תמונות AI") >= 0) {
          const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex, c: headers.indexOf("תמונות AI") });
          ws[cellAddress] = { t: "s", v: `פתח ${aiUrls.length} תמונות`, l: { Target: aiUrls[0], Tooltip: aiUrls.join(" | ") } };
        }
      });

      ws["!cols"] = headers.map(h => h.includes("תווית") ? { wch: 22 } : { wch: 16 });

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "דוח מנהל");
      const today = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `digipack-manager-report-${today}.xlsx`);
    }
