
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIGIPACK SMART FLOOR</title>
  <link rel="manifest" href="/manifest.json?v=23">
  <meta name="theme-color" content="#111827">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

      header, button, input, #reportTable, #employeesTableBody, #reportSummary { display: none !important; }

      .qr-label { page-break-inside: avoid; border: 1px solid #ccc !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div id="app"></div>

  <script>
    const SUPABASE_URL = "https://elxfkcwyfmgqysfcfhwy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WBpyhdYmnDFaphP4AM5QJA_KwGUXv3_";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentEmployee = null;
    let currentJob = null;
    let pendingStartData = null;
    let pendingOrderData = null;
    let reportRows = [];
    let currentPeriodName = "";

    function page(content) {
      document.getElementById("app").innerHTML = `<main class="p-4 pb-24 max-w-5xl mx-auto">${content}</main>`;
    }

    function topBar(title, subtitle = "") {
      return `
        <header class="bg-gray-900 border border-gray-800 rounded-3xl p-5 mb-5">
          <div class="flex items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold">${title}</h1>
              <p class="text-gray-400">${subtitle}</p>
            </div>
            <button onclick="renderLogin()" class="bg-gray-800 px-4 py-3 rounded-2xl text-sm">יציאה</button>
          </div>
        </header>`;
    }

    function fieldSelect(id, label, options) {
      return `<div><label class="block mb-2">${label}</label><select id="${id}" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700"><option value="">בחר</option>${options.map(o => `<option value="${o}">${o}</option>`).join("")}</select></div>`;
    }

    function fieldNumber(id, label) {
      return `<div><label class="block mb-2">${label}</label><input id="${id}" type="number" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700"></div>`;
    }

    function clearLoginPassword() {
      const password = document.getElementById("password");
      const error = document.getElementById("loginError");
      if (password) password.value = "";
      if (error) error.innerText = "";
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <main class="min-h-screen flex items-center justify-center p-4">
          <section class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl">
            <h1 class="text-3xl font-bold mb-2">DIGIPACK SMART FLOOR</h1>
            <p class="text-gray-400 mb-6">למינציה 1 — כניסה</p>

            <label class="block mb-2">עובד</label>
            <select id="employee" onchange="clearLoginPassword()" autocomplete="off" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700 mb-4"><option value="">בחר עובד</option></select>

            <label class="block mb-2">סיסמה</label>
            <input id="password" type="password" autocomplete="new-password" value="" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700 mb-6" placeholder="הכנס סיסמה">

            <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-lg">כניסה</button>
            <p id="loginError" class="text-red-400 mt-4"></p>
          </section>
        </main>`;
      setTimeout(clearLoginPassword, 50);
      loadEmployees();
    }

    async function loadEmployees() {
      const { data, error } = await client.from("employees").select("*").eq("active", true).order("name");
      const select = document.getElementById("employee");
      if (error) { document.getElementById("loginError").innerText = "שגיאה בטעינת עובדים: " + error.message; return; }
      data.forEach(emp => {
        const option = document.createElement("option");
        option.value = emp.id;
        option.textContent = emp.name;
        option.dataset.password = emp.password;
        option.dataset.role = emp.role;
        select.appendChild(option);
      });
    }

    function login() {
      const select = document.getElementById("employee");
      const selected = select.options[select.selectedIndex];
      const password = document.getElementById("password").value;
      if (!selected.value) return document.getElementById("loginError").innerText = "בחר עובד";
      if (password !== selected.dataset.password) { document.getElementById("password").value = ""; return document.getElementById("loginError").innerText = "סיסמה שגויה"; }

      currentEmployee = { id: selected.value, name: selected.textContent, role: selected.dataset.role };
      if (currentEmployee.role === "manager") renderManager();
      else renderStartForm();
    }


    function parseQRPayload(raw) {
      const text = String(raw || "").trim();

      try {
        const parsed = JSON.parse(text);
        return {
          order: parsed.order || parsed.order_number || parsed.pka || parsed["מספר הזמנה"] || "",
          line: parsed.line || parsed.order_line || parsed["שורה"] || "",
          customer: parsed.customer || parsed.customer_name || parsed["שם לקוח"] || "",
          product: parsed.product || parsed.product_name || parsed.description || parsed["תאור מוצר"] || parsed["תיאור מוצר"] || "",
          qty: parsed.qty || parsed.quantity || parsed["כמות"] || "",
          dueDate: parsed.dueDate || parsed.delivery_date || parsed["תאריך אספקה"] || "",
          qrCode: parsed.qrCode || text,
          raw: text
        };
      } catch (e) {
        const parts = text.split(".");
        return {
          order: parts[0] || text,
          line: parts.length > 1 ? parts[1] : "",
          customer: "",
          product: "",
          qty: "",
          dueDate: "",
          qrCode: text,
          raw: text
        };
      }
    }

    function renderOrderInfoCard() {
      if (!pendingOrderData) return "";
      return `
        <div class="bg-blue-900/30 border border-blue-700 rounded-2xl p-4 text-sm space-y-1">
          <div class="font-bold text-blue-200">נתוני QR שנסרקו</div>
          <div>הזמנה / פק״ע: ${escapeHtml(pendingOrderData.order || "")}</div>
          <div>שורה: ${escapeHtml(pendingOrderData.line || "")}</div>
          <div>לקוח: ${escapeHtml(pendingOrderData.customer || "")}</div>
          <div>שם מוצר: ${escapeHtml(pendingOrderData.product || "")}</div>
          <div>כמות: ${escapeHtml(pendingOrderData.qty || "")}</div>
        </div>`;
    }

    function renderQRScanner() {
      page(`
        ${topBar("סריקת QR הזמנה", `עובד: ${currentEmployee.name}`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">
          <p class="text-gray-300">כוון את המצלמה לברקוד/QR שעל פקודת העבודה.</p>
          <video id="qrVideo" class="w-full rounded-3xl bg-black border border-gray-700" autoplay playsinline></video>
          <canvas id="qrCanvas" class="hidden"></canvas>
          <p id="qrMsg" class="text-yellow-300">מפעיל מצלמה...</p>
          <button onclick="stopQRScanner(); renderStartForm()" class="w-full bg-gray-700 p-4 rounded-2xl font-bold">חזור</button>
        </section>`);
      startQRScanner();
    }

    let qrStream = null;
    let qrScanTimer = null;

    async function startQRScanner() {
      const msg = document.getElementById("qrMsg");
      const video = document.getElementById("qrVideo");

      if (!("BarcodeDetector" in window)) {
        msg.innerText = "הדפדפן לא תומך בסריקת QR מובנית. אפשר להקליד פק״ע ידנית.";
        return;
      }

      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = qrStream;
        const detector = new BarcodeDetector({ formats: ["qr_code"] });

        qrScanTimer = setInterval(async () => {
          try {
            const codes = await detector.detect(video);
            if (codes && codes.length) {
              const raw = codes[0].rawValue;
              pendingOrderData = parseQRPayload(raw);
              stopQRScanner();
              renderStartForm();
              setTimeout(() => {
                const pka = document.getElementById("pkaNumber");
                if (pka && pendingOrderData.order) pka.value = pendingOrderData.order;
              }, 50);
            }
          } catch (e) {}
        }, 500);

        msg.innerText = "מוכן לסריקה";
      } catch (e) {
        msg.innerText = "לא ניתן לפתוח מצלמה: " + e.message;
      }
    }

    function stopQRScanner() {
      if (qrScanTimer) clearInterval(qrScanTimer);
      qrScanTimer = null;
      if (qrStream) qrStream.getTracks().forEach(t => t.stop());
      qrStream = null;
    }

    function normalizeHeader(value) {
      return String(value || "")
        .replaceAll('"', "")
        .replaceAll("'", "")
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function findValue(row, candidates) {
      const keys = Object.keys(row || {});
      for (const candidate of candidates) {
        const normCandidate = normalizeHeader(candidate);
        const key = keys.find(k => normalizeHeader(k).includes(normCandidate) || normCandidate.includes(normalizeHeader(k)));
        if (key) return row[key] ?? "";
      }
      return "";
    }

    function buildQRPayloadFromRow(row) {
      const order = String(findValue(row, ["הזמנה", "מספר הזמנה", "פקע", "פק״ע", "order"]) || "").trim();
      const line = String(findValue(row, ["שורה", "line"]) || "").trim();
      const product = String(findValue(row, ["תאור מוצר", "תיאור מוצר", "שם מוצר", "מוצר", "description", "product"]) || "").trim();

      return {
        order,
        line,
        qrCode: line ? `${order}.${line}` : order,
        product,
        customer: String(findValue(row, ["שם לקוח", "לקוח", "customer"]) || "").trim(),
        qty: String(findValue(row, ["כמות", "יתרה לאספקה", "qty", "quantity"]) || "").trim(),
        dueDate: String(findValue(row, ["תאריך אספקה", "ת. אספקה", "אספקה", "due", "date"]) || "").trim()
      };
    }

    let qrOrderRows = [];

    async function loadOrdersExcelForQR() {
      const file = document.getElementById("ordersExcelFile").files[0];
      const msg = document.getElementById("qrGeneratorMsg");
      const container = document.getElementById("qrLabelsContainer");
      if (!file) { msg.innerText = "בחר קובץ Excel"; return; }

      msg.innerText = "קורא קובץ...";
      container.innerHTML = "";

      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
        qrOrderRows = rows.map(buildQRPayloadFromRow).filter(r => r.order || r.sku || r.customer);

        if (!qrOrderRows.length) {
          msg.innerText = "לא נמצאו שורות מתאימות בקובץ";
          return;
        }

        msg.innerText = `נמצאו ${qrOrderRows.length} שורות. יוצר QR...`;
        drawQRLabels(qrOrderRows);
        msg.innerText = `נוצרו ${qrOrderRows.length} מדבקות QR`;
      } catch (e) {
        msg.innerText = "שגיאה בקריאת Excel: " + e.message;
      }
    }

    function drawQRLabels(rows) {
      const container = document.getElementById("qrLabelsContainer");
      container.innerHTML = rows.map((r, i) => `
        <div class="qr-label bg-white text-black rounded-2xl p-4 border border-gray-300 break-inside-avoid">
          <div id="qr_${i}" class="flex justify-center mb-3 min-h-[130px]"></div>
          <div class="text-sm font-bold">QR: ${escapeHtml(r.qrCode)}</div>
          <div class="text-sm font-bold">הזמנה: ${escapeHtml(r.order)}</div>
          <div class="text-xs">שורה: ${escapeHtml(r.line)}</div>
          <div class="text-xs">לקוח: ${escapeHtml(r.customer)}</div>
          <div class="text-xs">שם מוצר: ${escapeHtml(r.product)}</div>
          <div class="text-xs">כמות: ${escapeHtml(r.qty)}</div>
          <div class="grid grid-cols-2 gap-2 mt-3 no-print">
            <button onclick="copyQRText('${String(r.qrCode).replaceAll("'", "\'")}')" class="bg-blue-600 text-white rounded-lg p-2 text-xs font-bold">העתק קוד</button>
            <button onclick="printSingleQR(${i})" class="bg-green-600 text-white rounded-lg p-2 text-xs font-bold">הדפס בודד</button>
          </div>
        </div>
      `).join("");

      rows.forEach((r, i) => {
        const el = document.getElementById(`qr_${i}`);
        if (el) {
          try {
            new QRCode(el, {
              text: r.qrCode,
              width: 128,
              height: 128,
              correctLevel: QRCode.CorrectLevel.M
            });
          } catch (e) {
            el.innerHTML = `<div class="text-red-700 text-xs">שגיאה ביצירת QR: ${escapeHtml(e.message)}</div>`;
          }
        }
      });
    }

    async function copyQRText(text) {
      try {
        await navigator.clipboard.writeText(text);
        alert("קוד QR הועתק: " + text);
      } catch (e) {
        alert("לא ניתן להעתיק אוטומטית. הקוד: " + text);
      }
    }

    function printSingleQR(index) {
      const row = qrOrderRows[index];
      if (!row) return;
      const win = window.open("", "_blank", "width=600,height=500");
      win.document.write(`
        <!DOCTYPE html>
        <html lang="he" dir="rtl">
        <head>
          <meta charset="UTF-8">
          <title>QR ${escapeHtml(row.qrCode)}</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
          <style>
            body { font-family: Arial; direction: rtl; padding: 20px; }
            .card { border: 2px solid #111; padding: 16px; width: 90mm; }
            #singleQr { margin-bottom: 12px; }
            .line { margin: 4px 0; font-size: 14px; }
            .big { font-size: 18px; font-weight: bold; }
            @media print { button { display:none; } }
          </style>
        </head>
        <body>
          <div class="card">
            <div id="singleQr"></div>
            <div class="big">QR: ${escapeHtml(row.qrCode)}</div>
            <div class="line">הזמנה: ${escapeHtml(row.order)}</div>
            <div class="line">שורה: ${escapeHtml(row.line)}</div>
            <div class="line">לקוח: ${escapeHtml(row.customer)}</div>
            <div class="line">שם מוצר: ${escapeHtml(row.product)}</div>
            <div class="line">כמות: ${escapeHtml(row.qty)}</div>
          </div>
          <button onclick="window.print()">הדפס</button>
          <script>
            new QRCode(document.getElementById("singleQr"), {
              text: ${JSON.stringify(row.qrCode)},
              width: 180,
              height: 180,
              correctLevel: QRCode.CorrectLevel.M
            });
            setTimeout(() => window.print(), 500);
          <\/script>
        </body>
        </html>
      `);
      win.document.close();
    }

    function printQRLabels() {
      window.print();
    }

    function renderStartForm() {
      page(`
        ${topBar("פתיחת עבודת למינציה", `עובד: ${currentEmployee.name} | למינציה 1`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">
          <h2 class="text-xl font-bold">פרטי עבודה</h2>
          ${renderOrderInfoCard()}
          <button onclick="renderQRScanner()" class="w-full bg-purple-600 p-4 rounded-2xl font-bold text-lg">סרוק QR הזמנה</button>

          <div>
            <label class="block mb-2">פק״ע</label>
            <input id="pkaNumber" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700" placeholder="לדוגמה: 0521-26" value="${pendingOrderData?.order || ''}">
          </div>

          <div>
            <label class="block mb-2">צילום תווית חומר גלם</label>
            <input id="labelPhoto" type="file" accept="image/*" capture="environment" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700">
          </div>

          <button onclick="goToStartQuality()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-lg">המשך לטופס איכות לפני התחלה</button>
          <p id="startMsg" class="mt-4 text-yellow-300"></p>
        </section>`);
    }

    function goToStartQuality() {
      const pkaNumber = document.getElementById("pkaNumber").value.trim();
      const file = document.getElementById("labelPhoto").files[0];
      if (!pkaNumber) return document.getElementById("startMsg").innerText = "חובה להזין פק״ע";
      if (!file) return document.getElementById("startMsg").innerText = "חובה לצלם תווית חומר גלם";
      pendingStartData = { pkaNumber, file };
      renderStartQuality();
    }

    function renderStartQuality() {
      page(`
        ${topBar("טופס איכות לפני תחילת עבודה", `פק״ע: ${pendingStartData.pkaNumber}`)}
        <section class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4">
          ${fieldSelect("laminate_direction", "כיוון למינט", ["קריא", "לא קריא"])}
          ${fieldSelect("raw_material_match", "התאמת חו״ג לפק״ע", ["כן", "לא"])}
          ${fieldNumber("thickness", "עובי")}
          ${fieldNumber("width", "רוחב")}
          ${fieldNumber("pitch", "פסיעה")}
          ${fieldSelect("print_cleanliness", "ניקיון הדפסה", ["תקין", "לא תקין"])}
          ${fieldSelect("material_color", "חומר", ["שקוף", "לבן"])}
          ${fieldSelect("finish_type", "גימור", ["מט", "מבריק"])}
          ${fieldSelect("lamination_strength", "חוזק למינציה", ["תקין", "לא תקין"])}
          ${fieldSelect("sealing_strength", "חוזק הלחמה", ["תקין", "לא תקין"])}
          ${fieldNumber("work_speed", "מהירות עבודה — מטר/דקה")}
          ${fieldNumber("drum_temperature", "טמפ׳ תוף")}
          ${fieldNumber("inlet_drum_temperature", "טמפ׳ תוף כניסה")}

          <label class="block">הערות</label>
          <textarea id="comments" class="w-full p-4 rounded-2xl bg-gray-800 border border-gray-700"></textarea>

          <button onclick="startJobWithQuality()" class="w-full bg-green-600 p-5 rounded-3xl text-xl font-bold">אשר איכות והתחל עבודה</button>
          <button onclick="renderStartForm()" class="w-full bg-gray-700 p-4 rounded-2xl font-bold">חזור</button>
          <p id="qualityMsg" class="mt-4 text-yellow-300"></p>
        </section>`);
    }

    function getQualityPayload(jobId) {
      const ids = ["laminate_direction","raw_material_match","thickness","width","pitch","print_cleanliness","material_color","finish_type","lamination_strength","sealing_strength","work_speed","drum_temperature","inlet_drum_temperature"];
      for (const id of ids) if (!document.getElementById(id).value) throw new Error("יש למלא את כל שדות האיכות");
      return {
        job_id: jobId,
        laminate_direction: document.getElementById("laminate_direction").value,
        raw_material_match: document.getElementById("raw_material_match").value === "כן",
        thickness: Number(document.getElementById("thickness").value),
        width: Number(document.getElementById("width").value),
        pitch: Number(document.getElementById("pitch").value),
        print_cleanliness: document.getElementById("print_cleanliness").value,
        material_color: document.getElementById("material_color").value,
        finish_type: document.getElementById("finish_type").value,
        lamination_strength: document.getElementById("lamination_strength").value,
        sealing_strength: document.getElementById("sealing_strength").value,
        work_speed: Number(document.getElementById("work_speed").value),
        drum_temperature: Number(document.getElementById("drum_temperature").value),
        inlet_drum_temperature: Number(document.getElementById("inlet_drum_temperature").value),
        comments: document.getElementById("comments").value,
        approved: true
      };
    }

    async function startJobWithQuality() {
      const msg = document.getElementById("qualityMsg");
      let qualityPayload;
      try { qualityPayload = getQualityPayload(null); } catch(e) { msg.innerText = e.message; return; }

      const { data: job, error } = await client.from("jobs").insert({
        order_number: pendingStartData.pkaNumber,
        employee_id: currentEmployee.id,
        batch_number: pendingStartData.pkaNumber,
        start_time: new Date().toISOString(),
        status: "open"
      }).select().single();

      if (error) { msg.innerText = "שגיאה ביצירת עבודה: " + error.message; return; }

      currentJob = job;
      await saveLabel(pendingStartData.file, job.id, pendingStartData.pkaNumber, "start");

      qualityPayload.job_id = job.id;
      const { error: qError } = await client.from("lamination_quality").insert(qualityPayload);
      if (qError) { msg.innerText = "שגיאה בשמירת איכות: " + qError.message; return; }

      renderActiveJob();
    }

    function buildPublicLabelUrl(fileName) {
      const encodedPath = fileName.split("/").map(encodeURIComponent).join("/");
      return `${SUPABASE_URL}/storage/v1/object/public/labels/${encodedPath}`;
    }

    async function saveLabel(file, jobId, pkaNumber, labelType) {
      const originalName = file.name || "label.jpg";
      const ext = originalName.includes(".") ? originalName.split(".").pop() : "jpg";
      const fileName = `${jobId}/${Date.now()}-${labelType}.${ext}`;
      const publicUrl = buildPublicLabelUrl(fileName);

      const { error: uploadError } = await client.storage
        .from("labels")
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: true,
          contentType: file.type || "image/jpeg"
        });

      if (uploadError) {
        console.error("שגיאה בהעלאת תווית:", uploadError);
        alert("שגיאה בהעלאת תווית ל-Storage: " + uploadError.message);
        return "";
      }

      const { error: insertError } = await client
        .from("material_labels")
        .insert({
          job_id: jobId,
          batch_number: pkaNumber,
          label_type: labelType,
          image_url: publicUrl
        });

      if (insertError) {
        console.error("שגיאה בשמירת קישור תווית:", insertError);
        alert("התמונה עלתה, אבל שמירת קישור התווית נכשלה: " + insertError.message);
        return publicUrl;
      }

      return publicUrl;
    }

    function renderActiveJob() {
      page(`
        ${topBar("עבודה פעילה", `פק״ע: ${currentJob.batch_number}`)}

    function getDateRange(period) {
      const start = new Date();
      const end = new Date();

      if (period === "today") {
        currentPeriodName = "היום";
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "yesterday") {
        currentPeriodName = "אתמול";
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "week") {
        currentPeriodName = "שבוע נוכחי";
        const day = start.getDay(); // Sunday = 0
        start.setDate(start.getDate() - day);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "month") {
        currentPeriodName = "חודש נוכחי";
        start.setDate(1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      if (period === "year") {
        currentPeriodName = "שנה נוכחית";
        start.setMonth(0,1);
        start.setHours(0,0,0,0);
        end.setHours(23,59,59,999);
      }

      return { start: start.toISOString(), end: end.toISOString() };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadReport(period) {
      const { start, end } = getDateRange(period);
      document.getElementById("reportSummary").innerText = "טוען דוח...";

      const { data: jobs, error } = await client
        .from("jobs")
        .select("*, employees(name)")
        .gte("created_at", start)
        .lte("created_at", end)
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("reportTable").innerHTML = `<p class="text-red-400">${escapeHtml(error.message)}</p>`;
        document.getElementById("reportSummary").innerText = "שגיאה בטעינת דוח";
        return;
      }

      const jobIds = (jobs || []).map(j => j.id).filter(Boolean);
      let labelsByJob = {};
      let qualityByJob = {};

      if (jobIds.length) {
        const { data: labels, error: labelsError } = await client
          .from("material_labels")
          .select("*")
          .in("job_id", jobIds);

        if (!labelsError && labels) {
          labels.forEach(label => {
            if (!labelsByJob[label.job_id]) labelsByJob[label.job_id] = [];
            labelsByJob[label.job_id].push(label);
          });
        }

        const { data: qualityRows, error: qualityError } = await client
          .from("lamination_quality")
          .select("*")
          .in("job_id", jobIds);

        if (!qualityError && qualityRows) {
          qualityRows.forEach(q => {
            if (!qualityByJob[q.job_id]) qualityByJob[q.job_id] = q;
          });
        }
      }

      function getLabelUrl(label) {
        return label.image_url || (label.file_path ? buildPublicLabelUrl(label.file_path) : "");
      }

      reportRows = (jobs || []).map(job => {
        const labels = labelsByJob[job.id] || [];
        const quality = qualityByJob[job.id] || {};

        const startLabels = labels.filter(l => l.label_type === "start").map(getLabelUrl).filter(Boolean);
        const extraLabels = labels.filter(l => l.label_type !== "start").map(getLabelUrl).filter(Boolean);
        const allLabelLinks = [...startLabels, ...extraLabels].filter(Boolean);

        return {
          "תאריך": job.created_at ? new Date(job.created_at).toLocaleDateString("he-IL") : "",
          "שעת התחלה": job.start_time ? new Date(job.start_time).toLocaleTimeString("he-IL") : "",
          "שעת סיום": job.end_time ? new Date(job.end_time).toLocaleTimeString("he-IL") : "",
          "שם מפעיל": job.employees?.name || "",
          "תהליך": job.department || "למינציה",
          "פק״ע": job.batch_number || job.order_number || "",
          "כמות מטרים להעברה": job.transfer_meters || "",

          "כיוון למינט": quality.laminate_direction || "",
          "התאמת חו״ג לפק״ע": quality.raw_material_match === true ? "כן" : (quality.raw_material_match === false ? "לא" : ""),
          "עובי": quality.thickness ?? "",
          "רוחב": quality.width ?? "",
          "פסיעה": quality.pitch ?? "",
          "ניקיון הדפסה": quality.print_cleanliness || "",
          "חומר": quality.material_color || "",
          "גימור": quality.finish_type || "",
          "חוזק למינציה": quality.lamination_strength || "",
          "חוזק הלחמה": quality.sealing_strength || "",
          "מהירות עבודה": quality.work_speed ?? "",
          "טמפ׳ תוף": quality.drum_temperature ?? "",
          "טמפ׳ תוף כניסה": quality.inlet_drum_temperature ?? "",
          "הערות איכות": quality.comments || "",
          "אושר איכות": quality.approved === true ? "כן" : (quality.approved === false ? "לא" : ""),

          "מספר תוויות חו״ג": allLabelLinks.length,
          "תווית חו״ג ראשית": startLabels[0] || allLabelLinks[0] || "",
          "כל תוויות חו״ג": allLabelLinks.join(" | ")
        };
      });

      document.getElementById("reportSummary").innerText = `${currentPeriodName}: נמצאו ${reportRows.length} רשומות`;
      drawReportTable(reportRows);
    }

    function drawReportTable(rows) {
      const cols = ['תאריך', 'שעת התחלה', 'שעת סיום', 'שם מפעיל', 'תהליך', 'פק״ע', 'כמות מטרים להעברה', 'כיוון למינט', 'התאמת חו״ג לפק״ע', 'עובי', 'רוחב', 'פסיעה', 'ניקיון הדפסה', 'חומר', 'גימור', 'חוזק למינציה', 'חוזק הלחמה', 'מהירות עבודה', 'טמפ׳ תוף', 'טמפ׳ תוף כניסה', 'הערות איכות', 'אושר איכות', 'מספר תוויות חו״ג', 'תווית חו״ג ראשית', 'כל תוויות חו״ג'];
      if (!rows.length) {
        document.getElementById("reportTable").innerHTML = "אין נתונים לתקופה שנבחרה";
        return;
      }

      function renderLabelButtons(value) {
        const links = String(value || "").split(" | ").filter(Boolean);
        if (!links.length) return "";
        return `<div class="flex gap-2 flex-wrap min-w-[220px]">${links.map((url, i) => `
          <a class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl font-bold whitespace-nowrap"
             href="${url}"
             target="_blank"
             rel="noopener noreferrer">
            פתח תווית ${i + 1}
          </a>
        `).join("")}</div>`;
      }

      function renderCell(col, value, row) {
        if (col === "תווית חו״ג ראשית") return renderLabelButtons(value);
        if (col === "כל תוויות חו״ג") return renderLabelButtons(value);
        return escapeHtml(value || "");
      }

      document.getElementById("reportTable").innerHTML = `
        <table class="w-full text-sm border-collapse">
          <thead><tr>${cols.map(c => `<th class="border border-gray-700 p-2 bg-gray-800 whitespace-nowrap">${c}</th>`).join("")}</tr></thead>
          <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="border border-gray-700 p-2 align-top whitespace-nowrap">${renderCell(c, r[c], r)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
    }

    function exportExcel() {
      if (!reportRows.length) { alert("אין נתונים לייצוא"); return; }
      const headers = ['תאריך', 'שעת התחלה', 'שעת סיום', 'שם מפעיל', 'תהליך', 'פק״ע', 'כמות מטרים להעברה', 'כיוון למינט', 'התאמת חו״ג לפק״ע', 'עובי', 'רוחב', 'פסיעה', 'ניקיון הדפסה', 'חומר', 'גימור', 'חוזק למינציה', 'חוזק הלחמה', 'מהירות עבודה', 'טמפ׳ תוף', 'טמפ׳ תוף כניסה', 'הערות איכות', 'אושר איכות', 'מספר תוויות חו״ג', 'תווית חו״ג ראשית', 'כל תוויות חו״ג'];

      const excelRows = reportRows.map(row => {
        const newRow = { ...row };
        if (newRow["תווית חו״ג ראשית"]) newRow["תווית חו״ג ראשית"] = "פתח תווית ראשית";
        if (newRow["כל תוויות חו״ג"]) {
          const count = String(row["כל תוויות חו״ג"]).split(" | ").filter(Boolean).length;
          newRow["כל תוויות חו״ג"] = `פתח ${count} תוויות`;
        }
        return newRow;
      });

      const ws = XLSX.utils.json_to_sheet(excelRows, { header: headers });

      reportRows.forEach((row, idx) => {
        const excelRowIndex = idx + 1;
        const mainUrl = row["תווית חו״ג ראשית"];
        const allUrls = String(row["כל תוויות חו״ג"] || "").split(" | ").filter(Boolean);

        if (mainUrl) {
          const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex, c: headers.indexOf("תווית חו״ג ראשית") });
          ws[cellAddress] = { t: "s", v: "פתח תווית ראשית", l: { Target: mainUrl, Tooltip: mainUrl } };
        }

        if (allUrls.length) {
          const cellAddress = XLSX.utils.encode_cell({ r: excelRowIndex, c: headers.indexOf("כל תוויות חו״ג") });
          ws[cellAddress] = { t: "s", v: `פתח ${allUrls.length} תוויות`, l: { Target: allUrls[0], Tooltip: allUrls.join(" | ") } };
        }
      });

      ws["!cols"] = headers.map(h => h.includes("תווית") ? { wch: 22 } : { wch: 16 });

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "דוח מנהל");
      const today = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `digipack-manager-report-${today}.xlsx`);
    }

    window.createEmployeeAdmin = createEmployeeAdmin;
    window.updateEmployeePassword = updateEmployeePassword;
    window.toggleEmployeeActive = toggleEmployeeActive;
    window.setEmployeeRole = setEmployeeRole;
    window.refreshEmployeesAdmin = refreshEmployeesAdmin;
    window.loadReport = loadReport;
    window.exportExcel = exportExcel;
    window.clearLoginPassword = clearLoginPassword;
    window.renderQRScanner = renderQRScanner;
    window.loadOrdersExcelForQR = loadOrdersExcelForQR;
    window.printQRLabels = printQRLabels;
    window.copyQRText = copyQRText;
    window.printSingleQR = printSingleQR;
    window.addRollInputRow = addRollInputRow;
    window.openRollLabelsPrint = openRollLabelsPrint;
    window.renderLogin = renderLogin;
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js?v=23");
    renderLogin();
  </script>
</body>
